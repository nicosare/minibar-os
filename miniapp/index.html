<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>MINIBAR OS</title>
<style>
  :root {
    --accent: #2688eb;
    --yellow: #ffcc00;
    --yellow-bg: rgba(255, 204, 0, 0.12);
    --danger: #ff5a5f;
    --bg-dark: #000000;
    --card-bg: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.10);
    --text-dim: rgba(255, 255, 255, 0.45);
    --page-pad: 14px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-dark);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, Arial, sans-serif;
  }

  body {
    overscroll-behavior: none;
  }

  button, input {
    font: inherit;
    -webkit-appearance: none;
    appearance: none;
  }

  #app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #000;
  }

  /* Top Bar */
  .top-bar {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
    background: #000;
    flex-shrink: 0;
  }

  .hotel-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .hotel-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .queue-count {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
  }


  /* Main View Area */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 var(--page-pad);
    gap: 8px;
    min-height: 0;
    overflow: hidden;
  }

  /* Viewfinder */
  .viewport-container {
    position: relative;
    width: 100%;
    max-width: 440px;
    flex: 0 1 auto;
    aspect-ratio: var(--camera-aspect, 0.75);
    min-height: 0;
    border-radius: 20px;
    overflow: hidden;
    background: #0b0b0d;
    border: 1px solid var(--card-border);
  }

  .viewfinder {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b0d;
  }

  #camera, #photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #0b0b0d;
    object-fit: contain;
    object-position: center;
  }

  #camera {
    opacity: 0;
    transition: opacity .2s ease;
  }

  #camera.ready { opacity: 1; }
  #photo {
    z-index: 2;
    object-fit: contain;
    object-position: center;
  }

  .camera-overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  .focus-corner {
    position: absolute;
    width: 18px;
    height: 18px;
    border-color: rgba(255,255,255,.6);
    border-style: solid;
    border-width: 0;
  }

  .focus-corner.tl { top: 14px; left: 14px; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 4px; }
  .focus-corner.tr { top: 14px; right: 14px; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 4px; }
  .focus-corner.bl { bottom: 14px; left: 14px; border-bottom-width: 2px; border-left-width: 2px; border-bottom-left-radius: 4px; }
  .focus-corner.br { bottom: 14px; right: 14px; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 4px; }

  .camera-loader {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    padding: 16px;
    background: #0b0b0d;
    color: rgba(255,255,255,.65);
    font-size: 13px;
    text-align: center;
  }

  .loader-spinner {
    width: 26px;
    height: 26px;
    border: 3px solid rgba(255,255,255,.11);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .75s linear infinite;
  }

  .loader-title { font-weight: 700; color: #fff; }
  .loader-subtitle { max-width: 260px; line-height: 16px; color: rgba(255,255,255,.5); font-size: 12px; }

  .loader-retry {
    margin-top: 4px;
    padding: 8px 14px;
    border: 0;
    border-radius: 10px;
    background: #fff;
    color: #000;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Carousel Section */
  .carousel-wrap {
    width: 100%;
    max-width: 440px;
    position: relative;
    flex-shrink: 0;
  }

  .carousel-wrap.disabled {
    opacity: .3;
    pointer-events: none;
  }

  .carousel-fade {
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 2;
    width: 40px;
    pointer-events: none;
  }

  .carousel-fade.left { left: 0; background: linear-gradient(90deg, #000 0%, rgba(0,0,0,0) 100%); }
  .carousel-fade.right { right: 0; background: linear-gradient(270deg, #000 0%, rgba(0,0,0,0) 100%); }

  .carousel {
    width: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 24px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0 calc(50% - 36px);
    scrollbar-width: none;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    touch-action: pan-x;
  }

  .carousel::-webkit-scrollbar { display: none; }

  .num-item {
    flex: 0 0 72px;
    width: 72px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    color: rgba(255,255,255,.32);
    font-size: 16px;
    font-weight: 600;
    background: transparent;
    border: none;
    user-select: none;
    cursor: pointer;
    transition: transform .15s ease, color .15s ease;
  }

  .num-item.active {
    color: var(--yellow);
    font-size: 24px;
    font-weight: 800;
    transform: scale(1.15);
    text-shadow: 0 0 12px rgba(255, 204, 0, 0.3);
  }

  /* Room Description Box */
  .room-description-box {
    width: 100%;
    max-width: 440px;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }

  .desc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .desc-title {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
  }

  .desc-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 700;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.3px;
  }

  .desc-tag.suite {
    background: rgba(255,204,0,0.15);
    color: var(--yellow);
    border: 1px solid rgba(255,204,0,0.25);
  }

  .desc-body {
    font-size: 12px;
    line-height: 15px;
    color: var(--text-dim);
  }

  /* Controls Section */
  .controls-section {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 16px;
  }

  .shutter-grid {
    width: 100%;
    max-width: 440px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 16px;
  }

  .grid-left { justify-self: start; }
  .grid-center { justify-self: center; }
  .grid-right { justify-self: end; }

  .btn-side {
    min-height: 38px;
    padding: 8px 14px;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    background: var(--card-bg);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s ease, background .15s ease;
  }

  .btn-side:active, .btn-send:active { transform: scale(.95); }

  .btn-side.danger {
    background: rgba(255, 90, 95, 0.12);
    border-color: rgba(255, 90, 95, 0.3);
    color: var(--danger);
  }

  #captureBtn {
    position: relative;
    width: 68px;
    height: 68px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 4px solid #fff;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    transition: transform .12s ease;
  }

  #captureBtn::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: #fff;
  }

  #captureBtn:active { transform: scale(.91); }
  #captureBtn.busy { opacity: .45; pointer-events: none; }

  .btn-send {
    min-height: 40px;
    padding: 8px 18px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(38,136,235,.30);
  }

  /* Bottom Sheet */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: opacity;
  }

  .sheet-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .bottom-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 201;
    max-width: 600px;
    margin: 0 auto;
    height: 82vh;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    background: #121214;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    display: flex;
    flex-direction: column;
    transform: translate3d(0, calc(100% - 46px), 0);
    transition: transform .28s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8);
    touch-action: none;
  }

  .bottom-sheet.open {
    transform: translate3d(0, 0, 0) !important;
  }

  .bottom-sheet.dragging {
    transition: none !important;
  }

  .sheet-handle-bar {
    padding: 10px 16px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: grab;
    user-select: none;
    background: #121214;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
  }

  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.35);
  }

  .sheet-peek-title {
    font-size: 13px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.8);
  }

  .sheet-header {
    padding: 4px 16px 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sheet-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sheet-title { font-size: 16px; font-weight: 800; color: #fff; }
  .sheet-subtitle { font-size: 12px; color: var(--text-dim); }

  .btn-close-sheet {
    border: 0;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .sheet-search {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 14px;
    outline: none;
  }

  .sheet-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 20px);
    display: flex;
    flex-direction: column;
    gap: 16px;
    touch-action: pan-y;
  }

  .floor-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .floor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    color: var(--yellow);
    padding-bottom: 4px;
    border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
  }

  .floor-stats { font-size: 11px; font-weight: 400; color: var(--text-dim); }

  .room-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
    gap: 8px;
  }

  .room-chip {
    padding: 8px 4px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .room-chip.suite {
    border-color: rgba(255, 204, 0, 0.25);
    background: rgba(255, 204, 0, 0.06);
  }

  .room-chip.suite .chip-type { color: var(--yellow); }

  .chip-type {
    font-size: 9px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.4);
  }

  .room-chip.selected {
    background: var(--yellow);
    color: #000;
    border-color: var(--yellow);
  }

  .room-chip.selected .chip-type { color: rgba(0, 0, 0, 0.7); }

  /* Notification Message */
  .camera-message {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 120px);
    z-index: 300;
    max-width: calc(100vw - 32px);
    padding: 10px 16px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    background: rgba(26,26,28,.95);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    opacity: 0;
    transform: translate3d(-50%, 10px, 0);
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }

  .camera-message.visible { opacity: 1; transform: translate3d(-50%, 0, 0); }

  .hidden { display: none !important; }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (min-width: 700px) {
    :root { --page-pad: 20px; }
    #app {
      max-width: 600px;
      margin: 0 auto;
      border-left: 1px solid rgba(255,255,255,.05);
      border-right: 1px solid rgba(255,255,255,.05);
    }
  }
</style>
</head>
<body>
<div id="app">
  <!-- Top Header with Queue Indicator -->
  <header class="top-bar">
    <div class="hotel-info">
      <div class="hotel-title">MINIBAR OS</div>
      <div class="queue-count" id="queueCount">В очереди: 0 номеров</div>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="main-content">
    <!-- Camera Viewfinder -->
    <div class="viewport-container">
      <div class="viewfinder" id="viewfinder">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="photo" class="hidden" aria-label="Снимок"></canvas>

        <div class="camera-overlay" aria-hidden="true">
          <span class="focus-corner tl"></span>
          <span class="focus-corner tr"></span>
          <span class="focus-corner bl"></span>
          <span class="focus-corner br"></span>
        </div>

        <div class="camera-loader" id="cameraLoader">
          <div class="loader-spinner" id="loaderSpinner"></div>
          <div class="loader-title" id="loaderTitle">Запуск камеры…</div>
          <div class="loader-subtitle" id="loaderSubtitle">Разреши доступ к камере, чтобы сделать снимок.</div>
          <button class="loader-retry hidden" id="loaderRetry" type="button">Повторить</button>
        </div>
      </div>
    </div>

    <!-- Room Carousel -->
    <div class="carousel-wrap" id="carouselWrap">
      <div class="carousel-fade left"></div>
      <div class="carousel" id="carousel" aria-label="Выбор номера"></div>
      <div class="carousel-fade right"></div>
    </div>

    <!-- Description Card -->
    <div class="room-description-box" id="roomDescription">
      <div class="desc-header">
        <span class="desc-title" id="descRoomTitle">Номер 500</span>
        <span class="desc-tag suite" id="descRoomTag">Люкс • 5 этаж</span>
      </div>
      <div class="desc-body" id="descRoomText">
        Информация о мини-баре и статус проверки (блок для будущего описания).
      </div>
    </div>

    <!-- Shutter Controls -->
    <div class="controls-section">
      <div class="shutter-grid" id="cameraActions">
        <div class="grid-left">
          <button class="btn-side danger" id="btnEmpty" type="button">Опустошён</button>
        </div>

        <div class="grid-center">
          <button id="captureBtn" type="button" aria-label="Сделать фото"></button>
        </div>

        <div class="grid-right"></div>
      </div>

      <div class="shutter-grid hidden" id="previewActions">
        <div class="grid-left">
          <button class="btn-side" id="btnRetake" type="button">Переснять</button>
        </div>

        <div class="grid-center"></div>

        <div class="grid-right">
          <button class="btn-send" id="btnSend" type="button">Отправить</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Bottom Sheet Modal -->
<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle-bar" id="sheetHandleArea">
    <div class="sheet-handle"></div>
    <div class="sheet-peek-title" id="sheetPeekTitle">Показать все номера</div>
  </div>

  <div class="sheet-header">
    <div class="sheet-title-row">
      <div>
        <div class="sheet-title">Все номера отеля</div>
        <div class="sheet-subtitle" id="sheetSubtitle">293 номера</div>
      </div>
      <button class="btn-close-sheet" id="btnCloseSheet" type="button">Закрыть</button>
    </div>
    <input type="search" class="sheet-search" id="sheetSearch" placeholder="Поиск номера...">
  </div>

  <div class="sheet-content" id="sheetContent"></div>
</div>

<div class="camera-message" id="message"></div>

<script type="module">
import bridge from 'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@3.0.2/+esm';

let ALL_ROOMS = [];
let ROOM_BY_NUMBER = new Map();
let FLOORS = [];
let queueRemaining = 0;

const API_BASE = '/api';

async function loadRooms() {
  const response = await fetch(API_BASE + '/rooms', {
    method: 'GET',
    headers: { Accept: 'application/json' },
    cache: 'no-store'
  });

  if (!response.ok) {
    throw new Error('Не удалось загрузить номера (HTTP ' + response.status + ')');
  }

  const rows = await response.json();

  if (!Array.isArray(rows) || rows.length === 0) {
    throw new Error('API не вернул список номеров');
  }

  ALL_ROOMS = rows
    .map(room => {
      const category = String(room.category || '').trim().toLowerCase();
      const type = category.includes('люкс') || category.includes('suite') ? 'suite' : 'standard';

      return {
        ...room,
        number: String(room.number),
        floor: Number(room.floor),
        type
      };
    })
    .sort((a, b) => Number(a.number) - Number(b.number));

  ROOM_BY_NUMBER = new Map(ALL_ROOMS.map(room => [room.number, room]));
  FLOORS = [...new Set(ALL_ROOMS.map(room => room.floor))].sort((a, b) => a - b);
  queueRemaining = ALL_ROOMS.length;
}

/* Orientation Tracking
   Не полагаемся только на screen.orientation: при выключенном
   автоповороте он может оставаться 0°. Для снимка важнее физическое
   положение телефона в момент нажатия кнопки. */
let currentDeviceAngle = 0;
let lastSensorOrientationAt = 0;

function normalizeAngle(angle) {
  return ((Number(angle) || 0) % 360 + 360) % 360;
}

function updateOrientationFromScreen() {
  if (window.screen && window.screen.orientation && typeof window.screen.orientation.angle === 'number') {
    currentDeviceAngle = normalizeAngle(window.screen.orientation.angle);
    return;
  }
  if (typeof window.orientation === 'number') {
    currentDeviceAngle = normalizeAngle(window.orientation);
  }
}

function updateOrientationFromSensor(beta, gamma) {
  if (!Number.isFinite(beta) || !Number.isFinite(gamma)) return;

  const absBeta = Math.abs(beta);
  const absGamma = Math.abs(gamma);

  // Portrait: phone is held upright. Landscape: phone is turned left/right.
  if (absGamma >= 45 && absBeta <= 70) {
    currentDeviceAngle = gamma > 0 ? 90 : 270;
    lastSensorOrientationAt = Date.now();
    return;
  }

  if (absBeta >= 45 && absGamma <= 55) {
    currentDeviceAngle = beta < 0 ? 180 : 0;
    lastSensorOrientationAt = Date.now();
  }
}

function getCaptureOrientationAngle() {
  if (Date.now() - lastSensorOrientationAt < 2000) {
    return normalizeAngle(currentDeviceAngle);
  }
  updateOrientationFromScreen();
  return normalizeAngle(currentDeviceAngle);
}

function syncViewportAfterOrientationChange() {
  updateOrientationFromScreen();
  // While a still preview is shown, keep the photo's own aspect.
  // Live camera aspect must not overwrite the rotated preview frame.
  if (!isPreview) syncLiveViewportAspect();
}

window.addEventListener('orientationchange', syncViewportAfterOrientationChange);
if (window.screen && window.screen.orientation) {
  window.screen.orientation.addEventListener('change', syncViewportAfterOrientationChange);
}
updateOrientationFromScreen();

function handleDeviceOrientationEvent(e) {
  updateOrientationFromSensor(e.beta, e.gamma);
}

if (window.DeviceOrientationEvent) {
  window.addEventListener('deviceorientation', handleDeviceOrientationEvent, true);
  window.addEventListener('deviceorientationabsolute', handleDeviceOrientationEvent, true);
}

/* Elements */
const video = document.getElementById('camera');
const photo = document.getElementById('photo');
const viewportContainer = document.querySelector('.viewport-container');
const canvas = photo;
const cameraLoader = document.getElementById('cameraLoader');
const loaderSpinner = document.getElementById('loaderSpinner');
const loaderTitle = document.getElementById('loaderTitle');
const loaderSubtitle = document.getElementById('loaderSubtitle');
const loaderRetry = document.getElementById('loaderRetry');
const carousel = document.getElementById('carousel');
const captureBtn = document.getElementById('captureBtn');
const btnRetake = document.getElementById('btnRetake');
const btnSend = document.getElementById('btnSend');
const btnEmpty = document.getElementById('btnEmpty');
const cameraActions = document.getElementById('cameraActions');
const previewActions = document.getElementById('previewActions');
const carouselWrap = document.getElementById('carouselWrap');
const queueCount = document.getElementById('queueCount');
const message = document.getElementById('message');

const descRoomTitle = document.getElementById('descRoomTitle');
const descRoomTag = document.getElementById('descRoomTag');

const btnCloseSheet = document.getElementById('btnCloseSheet');
const sheetOverlay = document.getElementById('sheetOverlay');
const bottomSheet = document.getElementById('bottomSheet');
const sheetContent = document.getElementById('sheetContent');
const sheetSearch = document.getElementById('sheetSearch');
const sheetHandleArea = document.getElementById('sheetHandleArea');
const sheetPeekTitle = document.getElementById('sheetPeekTitle');
const sheetSubtitle = document.getElementById('sheetSubtitle');

function setViewportAspect(width, height) {
  if (!viewportContainer || !width || !height) return;
  viewportContainer.style.setProperty('--camera-aspect', String(width / height));
}

function syncLiveViewportAspect() {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;

  const angle = getCaptureOrientationAngle();
  if (angle === 90 || angle === 270) {
    setViewportAspect(h, w);
  } else {
    setViewportAspect(w, h);
  }
}

let stream = null;
let videoTrack = null;
let torchSupported = false;
let torchArmed = false;
let torchPromise = null;
let selectedRoom = ALL_ROOMS[0];
let previewBlob = null;
let previewBlobPromise = null;
let snapTimer = null;
let messageTimer = null;
let isCapturing = false;
let isPreview = false;
let isVKReady = false;
let orientationPermissionAsked = false;
const carouselItems = new Map();
let activeCarouselItem = null;

function updateQueueDisplay() {
  queueCount.textContent = `В очереди: ${queueRemaining} номеров`;
}

function showMessage(text, duration = 1800) {
  message.textContent = text;
  message.classList.add('visible');
  clearTimeout(messageTimer);
  messageTimer = setTimeout(() => message.classList.remove('visible'), duration);
}

function setBusy(button, busy) {
  button.classList.toggle('busy', busy);
  button.setAttribute('aria-busy', String(busy));
}

async function initVK() {
  try {
    await bridge.send('VKWebAppInit');
    isVKReady = true;
  } catch (_) { isVKReady = false; }
}

function triggerHaptic() {
  try {
    if (isVKReady && bridge.supports('VKWebAppTapticSelectionChanged')) {
      bridge.send('VKWebAppTapticSelectionChanged');
      return;
    }
  } catch (_) {}
  try {
    if (navigator.vibrate) navigator.vibrate(8);
  } catch (_) {}
}

function ensureOrientationSensorPermission() {
  if (orientationPermissionAsked) return;
  orientationPermissionAsked = true;

  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().catch(() => {});
    }
  } catch (_) {}
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function waitForVideoFrame() {
  return new Promise(resolve => {
    if (typeof video.requestVideoFrameCallback === 'function') {
      video.requestVideoFrameCallback(() => resolve());
    } else {
      requestAnimationFrame(() => requestAnimationFrame(resolve));
    }
  });
}

function detectTorchSupport() {
  torchSupported = false;
  if (!videoTrack || typeof videoTrack.getCapabilities !== 'function') return;
  try {
    torchSupported = videoTrack.getCapabilities()?.torch === true;
  } catch (_) {
    torchSupported = false;
  }
}

async function setTorch(enabled) {
  if (!torchSupported || !videoTrack) return false;
  try {
    await videoTrack.applyConstraints({ advanced: [{ torch: enabled }] });
    return true;
  } catch (_) {
    return false;
  }
}

async function armTorch() {
  if (isPreview || !torchSupported) return torchArmed;
  if (torchArmed) return true;
  if (torchPromise) return torchPromise;

  torchPromise = setTorch(true).then(ok => {
    torchArmed = ok;
    torchPromise = null;
    return ok;
  });
  return torchPromise;
}

async function disarmTorch() {
  if (isCapturing) return;
  torchPromise = null;
  if (torchArmed || torchSupported) {
    torchArmed = false;
    setTorch(false);
  }
}

async function stopCamera() {
  torchArmed = false;
  torchPromise = null;
  if (stream) {
    for (const track of stream.getTracks()) {
      try { track.stop(); } catch (_) {}
    }
  }
  stream = null;
  videoTrack = null;
  torchSupported = false;
  video.srcObject = null;
  video.classList.remove('ready');
}

async function startCamera() {
  cameraLoader.classList.remove('error', 'hidden');
  cameraLoader.style.opacity = '1';
  loaderSpinner.classList.remove('hidden');
  loaderRetry.classList.add('hidden');
  loaderTitle.textContent = 'Запуск камеры…';

  await stopCamera();

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } }
    });

    videoTrack = stream.getVideoTracks()[0] || null;
    video.srcObject = stream;

    await video.play();
    detectTorchSupport();
    syncLiveViewportAspect();
    video.classList.add('ready');

    cameraLoader.style.opacity = '0';
    setTimeout(() => cameraLoader.classList.add('hidden'), 200);
  } catch (_) {
    cameraLoader.classList.add('error');
    loaderSpinner.classList.add('hidden');
    loaderRetry.classList.remove('hidden');
    loaderTitle.textContent = 'Не удалось открыть камеру';
  }
}

function drawRotatedVideoToCanvas(angle = getCaptureOrientationAngle()) {
  const srcW = video.videoWidth;
  const srcH = video.videoHeight;
  if (!srcW || !srcH) throw new Error('Frame error');

  angle = normalizeAngle(angle);

  if (angle === 90 || angle === 270) {
    canvas.width = srcH;
    canvas.height = srcW;
  } else {
    canvas.width = srcW;
    canvas.height = srcH;
  }

  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.save();

  if (angle === 90) {
    ctx.translate(srcH, 0);
    ctx.rotate(Math.PI / 2);
  } else if (angle === 180) {
    ctx.translate(srcW, srcH);
    ctx.rotate(Math.PI);
  } else if (angle === 270) {
    ctx.translate(0, srcW);
    ctx.rotate(-Math.PI / 2);
  }

  ctx.drawImage(video, 0, 0, srcW, srcH);
  ctx.restore();
}

function encodePreviewBlob() {
  previewBlob = null;
  previewBlobPromise = new Promise(resolve => {
    canvas.toBlob(
      blob => {
        previewBlob = blob && blob.size ? blob : null;
        resolve(previewBlob);
      },
      'image/jpeg',
      0.9
    );
  });
  return previewBlobPromise;
}

function showPreviewFromCanvas() {
  if (canvas.width && canvas.height) {
    setViewportAspect(canvas.width, canvas.height);
  }

  video.classList.remove('ready');
  video.classList.add('hidden');
  photo.classList.remove('hidden');

  cameraActions.classList.add('hidden');
  previewActions.classList.remove('hidden');
  carouselWrap.classList.add('disabled');

  isPreview = true;
}

function resetPhoto() {
  isPreview = false;
  previewBlob = null;
  previewBlobPromise = null;
  previewActions.classList.add('hidden');
  cameraActions.classList.remove('hidden');
  carouselWrap.classList.remove('disabled');

  photo.classList.add('hidden');
  video.classList.remove('hidden');
  video.classList.add('ready');

  // Всегда сбрасывать viewport в портретный формат
  if (video.videoWidth && video.videoHeight) {
    const w = video.videoWidth;
    const h = video.videoHeight;
    // Видео поток обычно ландшафтный — меняем местами для портрета
    setViewportAspect(Math.min(w, h), Math.max(w, h));
  }

  try { video.play(); } catch (_) {}
}

/* Carousel */
function buildCarousel() {
  carousel.innerHTML = '';
  carouselItems.clear();
  const fragment = document.createDocumentFragment();

  ALL_ROOMS.forEach(room => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'num-item';
    el.dataset.number = room.number;
    el.textContent = room.number;
    carouselItems.set(room.number, el);
    fragment.appendChild(el);
  });

  carousel.appendChild(fragment);

  const totalSuites = ALL_ROOMS.filter(r => r.type === 'suite').length;
  const totalStds = ALL_ROOMS.length - totalSuites;
  sheetPeekTitle.textContent = `Показать все номера (${ALL_ROOMS.length})`;
  sheetSubtitle.textContent = `${ALL_ROOMS.length} номеров (${totalSuites} люксов, ${totalStds} стандартов)`;

  requestAnimationFrame(() => {
    selectRoomByNumber(ALL_ROOMS[0].number, false, 'auto');
  });
}

function updateSelectedRoomState(room, vibrate = false) {
  if (!room) return;
  const changed = selectedRoom !== room;
  selectedRoom = room;

  if (activeCarouselItem) activeCarouselItem.classList.remove('active');
  const currentItem = carouselItems.get(room.number);
  if (currentItem) {
    currentItem.classList.add('active');
    activeCarouselItem = currentItem;
  }

  descRoomTitle.textContent = `Номер ${room.number}`;
  const isSuite = room.type === 'suite';
  descRoomTag.textContent = `${isSuite ? 'Люкс' : 'Стандарт'} • ${room.floor} этаж`;
  descRoomTag.className = `desc-tag ${isSuite ? 'suite' : ''}`;

  updateDrawerSelectedChip(room.number);
  if (vibrate && changed) triggerHaptic();
}

function selectRoomByNumber(numStr, vibrate = true, behavior = 'smooth') {
  const room = ROOM_BY_NUMBER.get(String(numStr));
  if (!room) return;

  const el = carouselItems.get(room.number);
  if (el) {
    updateSelectedRoomState(room, vibrate);
    el.scrollIntoView({ behavior, inline: 'center', block: 'nearest' });
  }
}

function updateNumberFromScroll() {
  const items = carousel.querySelectorAll('.num-item');
  if (!items.length) return;

  const carouselRect = carousel.getBoundingClientRect();
  const center = carouselRect.left + carouselRect.width / 2;

  let closest = null;
  let minDistance = Infinity;

  items.forEach(el => {
    const rect = el.getBoundingClientRect();
    const itemCenter = rect.left + rect.width / 2;
    const distance = Math.abs(itemCenter - center);

    if (distance < minDistance) {
      minDistance = distance;
      closest = el;
    }
  });

  if (closest) {
    const room = ROOM_BY_NUMBER.get(closest.dataset.number);
    if (room) updateSelectedRoomState(room, true);
  }
}

carousel.addEventListener('scroll', () => {
  updateNumberFromScroll();
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => updateNumberFromScroll(), 80);
}, { passive: true });

carousel.addEventListener('click', event => {
  const item = event.target.closest('.num-item');
  if (!item) return;
  selectRoomByNumber(item.dataset.number);
});

/* Bottom Sheet Drawer */
let isSheetOpen = false;
let startY = 0;
let currentY = 0;
let isDragging = false;
let sheetHeight = window.innerHeight * 0.82;
let rafId = null;

function renderDrawerRooms(filterQuery = '') {
  const q = filterQuery.trim().toLowerCase();
  const parts = [];
  let hasAny = false;

  for (const floorNum of FLOORS) {
    const floorRooms = ALL_ROOMS.filter(r => r.floor === floorNum && (!q || r.number.includes(q)));
    if (!floorRooms.length) continue;
    hasAny = true;

    const suitesCount = floorRooms.filter(r => r.type === 'suite').length;
    const stdsCount = floorRooms.length - suitesCount;
    const stats = [
      suitesCount ? `${suitesCount} люкс` : '',
      stdsCount ? `${stdsCount} станд.` : ''
    ].filter(Boolean).join(', ');

    parts.push(`<div class="floor-section">
      <div class="floor-header">
        <span>${floorNum} этаж</span>
        <span class="floor-stats">${floorRooms.length} номеров (${stats})</span>
      </div>
      <div class="room-grid">${floorRooms.map(room => `
        <div class="room-chip ${room.type === 'suite' ? 'suite' : ''} ${room.number === selectedRoom?.number ? 'selected' : ''}" data-room-number="${room.number}">
          <span>${room.number}</span>
          <span class="chip-type">${room.type === 'suite' ? 'Люкс' : 'Ст.'}</span>
        </div>`).join('')}
      </div>
    </div>`);
  }

  sheetContent.innerHTML = hasAny
    ? parts.join('')
    : `<div style="text-align: center; color: var(--text-dim); padding: 40px 0;">Номера не найдены</div>`;
}

function updateDrawerSelectedChip(numStr) {
  const chips = sheetContent.querySelectorAll('.room-chip');
  chips.forEach(chip => chip.classList.toggle('selected', chip.dataset.roomNumber === numStr));
}

function openSheet() {
  isSheetOpen = true;
  bottomSheet.classList.remove('dragging');
  sheetOverlay.classList.add('active');
  bottomSheet.classList.add('open');
  bottomSheet.style.transform = 'translate3d(0, 0, 0)';
  triggerHaptic();
}

function closeSheet() {
  isSheetOpen = false;
  bottomSheet.classList.remove('dragging');
  sheetOverlay.classList.remove('active');
  bottomSheet.classList.remove('open');
  bottomSheet.style.transform = 'translate3d(0, calc(100% - 46px), 0)';
}

function updateSheetTransform() {
  if (!isDragging) return;
  const deltaY = currentY - startY;

  if (!isSheetOpen) {
    if (deltaY < 0) {
      const translateY = Math.max(0, sheetHeight + deltaY);
      bottomSheet.style.transform = `translate3d(0, ${translateY}px, 0)`;
    }
  } else {
    if (deltaY > 0) {
      bottomSheet.style.transform = `translate3d(0, ${deltaY}px, 0)`;
    }
  }
}

sheetHandleArea.addEventListener('touchstart', e => {
  startY = e.touches[0].clientY;
  currentY = startY;
  isDragging = true;
  sheetHeight = bottomSheet.offsetHeight;
  bottomSheet.classList.add('dragging');
}, { passive: true });

window.addEventListener('touchmove', e => {
  if (!isDragging) return;
  currentY = e.touches[0].clientY;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(updateSheetTransform);
}, { passive: true });

window.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  bottomSheet.classList.remove('dragging');

  const deltaY = currentY - startY;
  if (!isSheetOpen) {
    if (deltaY < -40) openSheet();
    else closeSheet();
  } else {
    if (deltaY > 50) closeSheet();
    else openSheet();
  }
});

sheetHandleArea.addEventListener('click', () => {
  if (isSheetOpen) closeSheet();
  else openSheet();
});

btnCloseSheet.addEventListener('click', closeSheet);
sheetOverlay.addEventListener('click', closeSheet);
sheetSearch.addEventListener('input', e => renderDrawerRooms(e.target.value));
sheetContent.addEventListener('click', event => {
  const chip = event.target.closest('.room-chip');
  if (!chip) return;
  selectRoomByNumber(chip.dataset.roomNumber, true);
  closeSheet();
});

/* Actions */
async function takePhoto() {
  if (isCapturing || isPreview || !videoTrack) return;

  isCapturing = true;
  setBusy(captureBtn, true);
  triggerHaptic();

  try {
    const captureAngle = getCaptureOrientationAngle();
    const torchAlreadyOn = torchArmed;

    if (torchSupported) await armTorch();
    // Дать камере время на фокусировку и адаптацию к вспышке
    if (torchArmed) {
      await waitForVideoFrame();
      await wait(400);
    } else if (torchAlreadyOn) {
      await waitForVideoFrame();
    }

    drawRotatedVideoToCanvas(captureAngle);
    showPreviewFromCanvas();
    encodePreviewBlob();
  } catch (_) {
    showMessage('Ошибка при снимке');
  } finally {
    isCapturing = false;
    setBusy(captureBtn, false);
    torchArmed = false;
    torchPromise = null;
    setTorch(false);
  }
}

captureBtn.addEventListener('pointerdown', () => {
  ensureOrientationSensorPermission();
  armTorch();
}, { passive: true });

captureBtn.addEventListener('pointercancel', disarmTorch);
captureBtn.addEventListener('click', takePhoto);
btnRetake.addEventListener('click', () => { resetPhoto(); triggerHaptic(); });

async function sendPhotoToServer(blobFile, roomNum) {
  const formData = new FormData();
  formData.append('photo', blobFile, 'photo.jpg');
  formData.append('room', roomNum);
  try {
    const res = await fetch('/vk-proxy/send-photo', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();

    if (data.ok) {
      return { ok: true };
    } else {
      return { ok: false, error: data.error || 'Ошибка сервера' };
    }
  } catch (err) {
    return { ok: false, error: 'Сбой сети: ' + err.message };
  }
}

btnSend.addEventListener('click', async () => {
  if (!isPreview || btnSend.classList.contains('busy')) return;

  setBusy(btnSend, true);
  btnSend.textContent = 'Отправка…';

  try {
    // Берем готовый blob без повторного кодирования
    const blob = previewBlob || await previewBlobPromise;
    if (!blob) throw new Error('Не удалось сформировать файл');

    const result = await sendPhotoToServer(blob, selectedRoom.number);

    if (!result.ok) throw new Error(result.error);

    // Успешная отправка
    if (queueRemaining > 0) queueRemaining--;
    updateQueueDisplay();

    btnSend.textContent = 'Отправлено';
    await triggerHaptic();

    setTimeout(() => {
      btnSend.textContent = 'Отправить';
      setBusy(btnSend, false);
      resetPhoto();
    }, 500);

  } catch (err) {
    // Показываем ошибку на 3.5 секунды, чтобы успеть прочитать
    showMessage('Ошибка отправки: ' + err.message, 3500);
    btnSend.textContent = 'Отправить';
    setBusy(btnSend, false);
  }
});

btnEmpty.addEventListener('click', () => {
  triggerHaptic();
  if (queueRemaining > 0) queueRemaining--;
  updateQueueDisplay();
  showMessage(`№ ${selectedRoom.number} помечен как «Опустошён»`);
});

loaderRetry.addEventListener('click', startCamera);

(async function boot() {
  try {
    await loadRooms();
    updateQueueDisplay();
    buildCarousel();
    renderDrawerRooms();
  } catch (error) {
    console.error('Rooms load error:', error);
    showMessage(error.message || 'Не удалось загрузить номера', 5000);
    return;
  }

  await initVK();
  await startCamera();
})();
</script>
