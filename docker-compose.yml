services:

  db:
    image: postgres:15-alpine
    container_name: minibar-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - minibar_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: minibar-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
      NODE_ENV: ${NODE_ENV}
      TZ: ${TZ}
      APP_TIMEZONE: ${APP_TIMEZONE}
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: minibar-web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  miniapp:
    build:
      context: ./miniapp
    container_name: minibar-miniapp
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped

  vk-proxy:
    build:
      context: ./vk-proxy
    container_name: minibar-vk-proxy
    environment:
      VK_PROXY_PORT: ${VK_PROXY_PORT}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN}
      VK_API_VERSION: ${VK_API_VERSION}
      VK_DEFAULT_PEER_ID: ${VK_DEFAULT_PEER_ID}
      VK_ALLOWED_PEER_IDS: ${VK_ALLOWED_PEER_IDS}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped

volumes:
  minibar_db_data:
