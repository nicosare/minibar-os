name: Minibar OS CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - design/desktop-unification
  pull_request:
    branches:
      - main
      - design/desktop-unification
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'miniapp/**'
      - 'vk-proxy/**'
      - 'vk-bot/**'
      - 'scripts/deploy-production.sh'
      - 'docker-compose.yml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  desktop-smoke:
    name: Browser smoke tests and production image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build frontend image
        run: docker build -t minibar-os-frontend-smoke ./frontend

      - name: Create isolated Docker network
        run: docker network create minibar-os-smoke

      - name: Start backend hostname stub
        run: docker run -d --name minibar-smoke-backend --network minibar-os-smoke --network-alias backend nginx:alpine

      - name: Start frontend
        run: docker run -d --name minibar-frontend-smoke --network minibar-os-smoke -p 8080:80 minibar-os-frontend-smoke

      - name: Wait for frontend
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs minibar-smoke-backend || true
          docker logs minibar-frontend-smoke
          exit 1

      # Run for every CI invocation. GitHub's head_commit.modified list omits
      # added/removed/renamed files, so it is not a safe test-selection mechanism.
      - name: Run desktop browser smoke tests
        run: node frontend/tests/desktop-smoke.cjs

      - name: Test VK Mini App photo destination
        run: |
          node --check vk-proxy/server.js
          node --check vk-proxy/peer-id.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('miniapp/index.html', 'utf8');
          const match = html.match(/<script\b[^>]*type=["']module["'][^>]*>([\s\S]*?)<\/script>/i);
          if (!match) throw new Error('Mini App module script not found');
          const source = match[1].replace(/^import\s+bridge\s+from\s+['"][^'"]+['"];\s*/m, 'const bridge = {};');
          new Function(source);
          if (!source.includes('PHOTO_QUEUE_DB_NAME') || !source.includes('schedulePhotoQueueRetry')) {
            throw new Error('Persistent photo queue or retry logic is missing');
          }
          console.log('Mini App module syntax and persistent photo queue: OK');
          NODE

      - name: Build all production service images
        run: |
          docker build -t minibar-os-ci-backend ./backend
          docker build -t minibar-os-ci-miniapp ./miniapp
          docker build -t minibar-os-ci-vk-proxy ./vk-proxy
          docker build -t minibar-os-ci-vk-bot ./vk-bot

      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find backend/src vk-proxy vk-bot -type f -name '*.js' -print0)

      - name: Check deployment script syntax
        run: bash -n scripts/deploy-production.sh

      - name: Run existing unit test suites
        run: |
          node --test \
            backend/src/services/deadlines.test.js \
            backend/src/services/emptiedToday.test.js \
            vk-proxy/peer-id.test.cjs

      - name: Show frontend logs on failure
        if: failure()
        run: docker logs minibar-frontend-smoke || true

      - name: Stop smoke-test containers
        if: always()
        run: |
          docker rm -f minibar-frontend-smoke minibar-smoke-backend || true
          docker network rm minibar-os-smoke || true

  deploy:
    name: Deploy changed components to production
    needs: desktop-smoke
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/design/desktop-unification')) ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/design/desktop-unification'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep only one production deploy active. If a newer run replaces a pending
    # run, the deploy script still compares the last-successful marker to the
    # latest branch ref and deploys the cumulative change set.
    concurrency:
      group: minibar-os-production-deploy
      cancel-in-progress: false

    steps:
      - name: Check out deployment commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment credentials
        id: credentials
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [[ -z "$VPS_HOST" || -z "$VPS_SSH_PRIVATE_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            {
              echo "## Production deployment: FAILED"
              echo
              echo "Deployment credentials are missing. No server changes were made."
              echo "Configure VPS_HOST, VPS_SSH_PRIVATE_KEY and VPS_KNOWN_HOSTS in GitHub Actions secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::VPS deployment secrets are missing. Deployment cannot be reported as successful."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Advance the server deployment ref
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: git push origin HEAD:refs/heads/design/desktop-unification

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy on VPS and capture the result
        id: deploy_result
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/minibar-deploy.log"
          if ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "minibar-deploy@$VPS_HOST" deploy 2>&1 | tee "$log_file"; then
            {
              echo "## Production deployment: SUCCESS"
              echo
              echo "- Commit: $GITHUB_SHA"
              echo "- Deployment output:"
              echo '~~~text'
              tail -n 30 "$log_file"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Production deployment: FAILED"
              echo
              echo "- Commit: $GITHUB_SHA"
              echo "- The remote deploy command failed. Review the output below."
              echo '~~~text'
              tail -n 80 "$log_file"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Report the deployment result
        if: always()
        shell: bash
        run: |
          echo "Workflow: $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
