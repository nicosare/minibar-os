server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The app uses /minibar-os as its history/API prefix. In this isolated
    # preview container, strip that prefix locally before serving assets/routes.
    location = /minibar-os/api/events {
        rewrite ^/minibar-os/api/events$ /api/events break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location ^~ /minibar-os/api/ {
        rewrite ^/minibar-os/api/(.*)$ /api/$1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /minibar-os/ {
        rewrite ^/minibar-os/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
