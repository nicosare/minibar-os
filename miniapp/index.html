<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>MINIBAR OS</title>
<style>
  :root {
    --accent: #2688eb;
    --yellow: #ffcc00;
    --yellow-bg: rgba(255, 204, 0, 0.12);
    --danger: #ff5a5f;
    --bg-dark: #000000;
    --card-bg: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.10);
    --text-dim: rgba(255, 255, 255, 0.45);
    --page-pad: 14px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-dark);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, Arial, sans-serif;
  }

  body {
    overscroll-behavior: none;
  }

  button, input {
    font: inherit;
    -webkit-appearance: none;
    appearance: none;
  }

  #app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #000;
  }

  /* Top Bar */
  .top-bar {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
    background: #000;
    flex-shrink: 0;
  }

  .hotel-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .hotel-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .queue-count {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
  }

  .upload-status {
    display: none;
    max-width: calc(100vw - 32px);
    margin-top: 2px;
    overflow: hidden;
    color: var(--yellow);
    font-size: 11px;
    font-weight: 500;
    line-height: 1.3;
    text-overflow: ellipsis;
  }

  .upload-status.visible { display: block; }
  .upload-status.error { color: var(--danger); }
  .upload-status.success { color: #4cd964; }

  /* Main View Area */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 var(--page-pad);
    gap: 8px;
    min-height: 0;
    overflow: hidden;
  }

  /* Viewfinder */
  .viewport-container {
    position: relative;
    /* The viewfinder is a fixed 3:4 window. Device rotation never changes it. */
    width: min(88vw, 440px, calc(58dvh * 0.75));
    aspect-ratio: 3 / 4;
    max-height: 58dvh;
    flex: 0 0 auto;
    min-height: 0;
    border-radius: 20px;
    overflow: hidden;
    background: #0b0b0d;
    border: 1px solid var(--card-border);
  }

  .viewfinder {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b0d;
  }

  #camera {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #0b0b0d;
    object-fit: contain;
    object-position: center;
    opacity: 0;
    transition: opacity .2s ease;
  }

  #camera.ready { opacity: 1; }

  /* The captured canvas lives in its own modal, not in the viewfinder. */
  .photo-modal #photo {
    position: relative;
    inset: auto;
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    background: transparent;
    object-fit: contain;
    object-position: center;
    border-radius: 8px;
  }

  .camera-overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  .focus-corner {
    position: absolute;
    width: 18px;
    height: 18px;
    border-color: rgba(255,255,255,.6);
    border-style: solid;
    border-width: 0;
  }

  .focus-corner.tl { top: 14px; left: 14px; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 4px; }
  .focus-corner.tr { top: 14px; right: 14px; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 4px; }
  .focus-corner.bl { bottom: 14px; left: 14px; border-bottom-width: 2px; border-left-width: 2px; border-bottom-left-radius: 4px; }
  .focus-corner.br { bottom: 14px; right: 14px; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 4px; }

  .camera-loader {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    padding: 16px;
    background: #0b0b0d;
    color: rgba(255,255,255,.65);
    font-size: 13px;
    text-align: center;
  }

  .loader-spinner {
    width: 26px;
    height: 26px;
    border: 3px solid rgba(255,255,255,.11);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .75s linear infinite;
  }

  .loader-title { font-weight: 700; color: #fff; }
  .loader-subtitle { max-width: 260px; line-height: 16px; color: rgba(255,255,255,.5); font-size: 12px; }

  .loader-retry {
    margin-top: 4px;
    padding: 8px 14px;
    border: 0;
    border-radius: 10px;
    background: #fff;
    color: #000;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Carousel Section */
  .carousel-wrap {
    width: 100%;
    max-width: 440px;
    position: relative;
    flex-shrink: 0;
  }

  .carousel-wrap.disabled {
    opacity: .3;
    pointer-events: none;
  }

  .carousel-fade {
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 2;
    width: 40px;
    pointer-events: none;
  }

  .carousel-fade.left { left: 0; background: linear-gradient(90deg, #000 0%, rgba(0,0,0,0) 100%); }
  .carousel-fade.right { right: 0; background: linear-gradient(270deg, #000 0%, rgba(0,0,0,0) 100%); }

  .carousel {
    width: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 24px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0 calc(50% - 36px);
    scrollbar-width: none;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    touch-action: pan-x;
  }

  .carousel::-webkit-scrollbar { display: none; }

  .num-item {
    flex: 0 0 72px;
    width: 72px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    color: rgba(255,255,255,.32);
    font-size: 16px;
    font-weight: 600;
    background: transparent;
    border: none;
    user-select: none;
    cursor: pointer;
    transition: transform .15s ease, color .15s ease;
  }

  .num-item.active {
    color: var(--yellow);
    font-size: 24px;
    font-weight: 800;
    transform: scale(1.15);
    text-shadow: 0 0 12px rgba(255, 204, 0, 0.3);
  }

  /* Camera block shown while the camera is on standby. */
  .camera-info-panel {
    position: absolute;
    inset: 0;
    z-index: 8;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    overflow: hidden;
    background: #0b0b0d;
  }

  .camera-info-heading {
    flex: 0 0 auto;
    font-size: 15px;
    line-height: 20px;
    font-weight: 800;
    letter-spacing: .1px;
  }

  .camera-history-label {
    flex: 0 0 auto;
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .7px;
    text-transform: uppercase;
  }

  .camera-history-list {
    min-height: 0;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow-y: auto;
    scrollbar-width: none;
  }

  .camera-history-list::-webkit-scrollbar { display: none; }

  .camera-history-entry {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 8px 9px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 9px;
    background: rgba(255,255,255,.045);
    min-width: 0;
  }

  .camera-history-date {
    color: rgba(255,255,255,.48);
    font-size: 10px;
    font-weight: 600;
    line-height: 13px;
  }

  .camera-history-summary {
    color: rgba(255,255,255,.9);
    font-size: 11px;
    font-weight: 650;
    line-height: 15px;
    overflow-wrap: anywhere;
  }

  .camera-history-operation.is-empty { color: #ff7d82; }
  .camera-history-operation.is-gih { color: #c6a6ff; }
  .camera-history-gih-status { color: rgba(255,255,255,.68); font-weight: 750; }
  .camera-history-separator { color: rgba(255,255,255,.35); }

  .camera-history-note {
    color: rgba(255,255,255,.55);
    font-size: 10px;
    line-height: 13px;
    overflow-wrap: anywhere;
  }

  .camera-history-empty {
    padding: 12px 4px;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 17px;
  }

  .room-description-box {
    width: 100%;
    flex: 0 0 auto;
    margin-top: auto;
    padding: 11px 12px;
    border-radius: 11px;
    background: rgba(255,255,255,.055);
    border: 1px solid var(--card-border);
  }

  .desc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .desc-title {
    min-width: 0;
    font-size: 14px;
    font-weight: 800;
    color: #fff;
  }

  .desc-tag {
    flex: 0 0 auto;
    font-size: 10px;
    padding: 4px 7px;
    border-radius: 6px;
    font-weight: 750;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  .desc-tag.suite {
    background: rgba(255,204,0,0.15);
    color: var(--yellow);
    border: 1px solid rgba(255,204,0,0.25);
  }

  /* Controls Section */
  .controls-section {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 16px;
  }

  .shutter-grid {
    width: 100%;
    max-width: 440px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 16px;
  }

  .grid-left { justify-self: start; }
  .grid-center { justify-self: center; }
  .grid-right { justify-self: end; }

  .btn-side {
    min-height: 38px;
    padding: 8px 14px;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    background: var(--card-bg);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s ease, background .15s ease;
  }

  .btn-side:active, .btn-send:active { transform: scale(.95); }

  .btn-side.danger {
    background: rgba(255, 90, 95, 0.12);
    border-color: rgba(255, 90, 95, 0.3);
    color: var(--danger);
  }

  #captureBtn {
    position: relative;
    width: 68px;
    height: 68px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 4px solid #fff;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    transition: transform .12s ease;
  }

  #captureBtn::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: #fff;
  }

  #captureBtn:active { transform: scale(.91); }
  #captureBtn.busy { opacity: .45; pointer-events: none; }

  .btn-send {
    min-height: 40px;
    padding: 8px 18px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(38,136,235,.30);
  }

  /* Bottom Sheet */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: opacity;
  }

  .sheet-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .bottom-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 201;
    max-width: 600px;
    margin: 0 auto;
    height: 82vh;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    background: #121214;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    display: flex;
    flex-direction: column;
    transform: translate3d(0, calc(100% - 46px), 0);
    transition: transform .28s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8);
    touch-action: none;
  }

  .bottom-sheet.open {
    transform: translate3d(0, 0, 0) !important;
  }

  .bottom-sheet.dragging {
    transition: none !important;
  }

  .sheet-handle-bar {
    padding: 10px 16px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: grab;
    user-select: none;
    background: #121214;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
  }

  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.35);
  }

  .sheet-peek-title {
    font-size: 13px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.8);
  }

  .sheet-header {
    padding: 4px 16px 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sheet-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sheet-title { font-size: 16px; font-weight: 800; color: #fff; }
  .sheet-subtitle { font-size: 12px; color: var(--text-dim); }

  .btn-close-sheet {
    border: 0;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .sheet-search {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 14px;
    outline: none;
  }

  .sheet-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 20px);
    display: flex;
    flex-direction: column;
    gap: 16px;
    touch-action: pan-y;
  }

  .floor-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .floor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    color: var(--yellow);
    padding-bottom: 4px;
    border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
  }

  .floor-stats { font-size: 11px; font-weight: 400; color: var(--text-dim); }

  .room-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
    gap: 8px;
  }

  .room-chip {
    padding: 8px 4px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .room-chip.empty-room {
    color: #7ddcff;
    border-color: rgba(70, 195, 245, 0.62);
    background: rgba(70, 195, 245, 0.13);
  }

  .room-chip.empty-room.selected {
    color: #06202b;
    border-color: #4cc7f4;
    background: #4cc7f4;
  }

  .room-chip.selected {
    background: var(--yellow);
    color: #000;
    border-color: var(--yellow);
  }

  .room-chip.empty-room.selected {
    color: #06202b;
    border-color: #4cc7f4;
    background: #4cc7f4;
  }

  /* Notification Message */
  .camera-message {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 120px);
    z-index: 300;
    max-width: calc(100vw - 32px);
    padding: 10px 16px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    background: rgba(26,26,28,.95);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    opacity: 0;
    transform: translate3d(-50%, 10px, 0);
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }

  .camera-message.visible { opacity: 1; transform: translate3d(-50%, 0, 0); }

  .hidden { display: none !important; }

  /* Review the finished image separately; the 3:4 camera frame stays untouched. */
  .photo-modal {
    position: fixed;
    inset: 0;
    z-index: 250;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
    background: rgba(0, 0, 0, 0.97);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .18s ease, visibility .18s ease;
  }

  .photo-modal.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .photo-preview-area {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 600px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .photo-modal-actions {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    flex: 0 0 auto;
  }

  .photo-modal-actions .shutter-grid {
    max-width: none;
    padding: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (min-width: 700px) {
    :root { --page-pad: 20px; }
    #app {
      max-width: 600px;
      margin: 0 auto;
      border-left: 1px solid rgba(255,255,255,.05);
      border-right: 1px solid rgba(255,255,255,.05);
    }
  }
</style>
</head>
<body>
<div id="app">
  <!-- Top Header with Queue Indicator -->
  <header class="top-bar">
    <div class="hotel-info">
      <div class="hotel-title">MINIBAR OS</div>
      <div class="queue-count" id="queueCount">В очереди: 0 номеров</div>
      <div class="upload-status" id="uploadStatus" aria-live="polite"></div>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="main-content">
    <!-- Camera Viewfinder -->
    <div class="viewport-container">
      <div class="viewfinder" id="viewfinder">
        <video id="camera" autoplay playsinline muted></video>

        <div class="camera-overlay" aria-hidden="true">
          <span class="focus-corner tl"></span>
          <span class="focus-corner tr"></span>
          <span class="focus-corner bl"></span>
          <span class="focus-corner br"></span>
        </div>

        <div class="camera-loader hidden" id="cameraLoader">
          <div class="loader-spinner hidden" id="loaderSpinner"></div>
          <div class="loader-title" id="loaderTitle">Запуск камеры…</div>
          <div class="loader-subtitle" id="loaderSubtitle">Подготавливаю камеру и ориентацию снимка…</div>
          <button class="loader-retry hidden" id="loaderRetry" type="button">Повторить</button>
        </div>

        <section class="camera-info-panel" id="cameraInfoPanel" aria-label="Блок камеры">
          <div class="camera-info-heading">Блок камеры</div>
          <div class="camera-history-label">3 последние операции</div>
          <div class="camera-history-list" id="roomHistoryItems" aria-live="polite">
            <div class="camera-history-empty">Загрузка истории…</div>
          </div>
          <div class="room-description-box" id="roomDescription">
            <div class="desc-header">
              <span class="desc-title" id="descRoomTitle">Номер 500</span>
              <span class="desc-tag" id="descRoomTag">5 этаж · Стандарт</span>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- Room Carousel -->
    <div class="carousel-wrap" id="carouselWrap">
      <div class="carousel-fade left"></div>
      <div class="carousel" id="carousel" aria-label="Выбор номера"></div>
      <div class="carousel-fade right"></div>
    </div>

    <!-- Shutter Controls -->
    <div class="controls-section">
      <div class="shutter-grid" id="cameraActions">
        <div class="grid-left">
          <button class="btn-side danger" id="btnEmpty" type="button">Опустошён</button>
        </div>

        <div class="grid-center">
          <button id="captureBtn" type="button" aria-label="Сделать фото"></button>
        </div>

        <div class="grid-right"></div>
      </div>

    </div>
  </main>
</div>

<!-- Still Photo Preview Modal -->
<div class="photo-modal" id="photoModal" role="dialog" aria-modal="true" aria-label="Предпросмотр фотографии" aria-hidden="true">
  <div class="photo-preview-area">
    <canvas id="photo" class="hidden" aria-label="Снимок"></canvas>
  </div>
  <div class="photo-modal-actions">
    <div class="shutter-grid hidden" id="previewActions">
      <div class="grid-left">
        <button class="btn-side" id="btnRetake" type="button">Переснять</button>
      </div>

<script type="module">
import bridge from 'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@3.0.2/+esm';

let ALL_ROOMS = [];
let ROOM_BY_NUMBER = new Map();
let FLOORS = [];
let queueRemaining = 0;

const API_BASE = '/minibar-os/api';

async function loadRooms() {
  const response = await fetch(API_BASE + '/miniapp/queue', {
    method: 'GET',
    headers: { Accept: 'application/json' },
    cache: 'no-store'
  });

  if (!response.ok) {
    throw new Error('Не удалось загрузить очередь (HTTP ' + response.status + ')');
  }

  const data = await response.json();

  if (!data || !Array.isArray(data.rooms) || data.rooms.length === 0) {
    throw new Error('API не вернул очередь номеров');
  }

  ALL_ROOMS = data.rooms
    .map(room => ({
      ...room,
      number: String(room.number),
      floor: Number(room.floor),
      type: String(room.category || '').toLowerCase().includes('люкс') ||
            String(room.category || '').toLowerCase().includes('suite')
        ? 'suite'
        : 'standard'
    }))
    .sort((a, b) => Number(a.number) - Number(b.number));

  ROOM_BY_NUMBER = new Map(ALL_ROOMS.map(room => [room.number, room]));
  FLOORS = [...new Set(ALL_ROOMS.map(room => room.floor))].sort((a, b) => a - b);
  queueRemaining = Number.isFinite(data.remaining) ? data.remaining : ALL_ROOMS.length;
}

async function completeRoom(action) {
  if (!selectedRoom?.id) throw new Error('Не выбран номер');

  const response = await fetch(API_BASE + '/miniapp/rooms/' + selectedRoom.id + '/complete', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Accept: 'application/json'
    },
    body: JSON.stringify({ action })
  });

  if (!response.ok) {
    let message = 'Не удалось обновить очередь';
    try {
      const data = await response.json();
      if (data?.error) message = data.error;
    } catch (_) {}
    throw new Error(message);
  }

  const task = ALL_ROOMS.find(room => room.id === selectedRoom.id);
  if (task) {
    task.status = 'completed';
    task.action = action;
  }

  queueRemaining = Math.max(0, queueRemaining - 1);
  updateQueueDisplay();
}

/* Determine handset rotation from gravity projected onto the screen plane.
   Ignore the Z component: tilting the display toward/away from the user must
   not change portrait/landscape or flip a captured photo. */
let currentDeviceAngle = 0;
let lastSensorOrientationAt = 0;
let hasSensorOrientation = false;
let hasMotionOrientation = false;

function normalizeAngle(angle) {
  return ((Number(angle) % 360) + 360) % 360;
}

function updateOrientationFromScreen() {
  if (hasSensorOrientation) return;

  let angle = null;
  if (window.screen?.orientation &&
      typeof window.screen.orientation.angle === 'number') {
    angle = normalizeAngle(window.screen.orientation.angle);
  } else if (typeof window.orientation === 'number') {
    angle = normalizeAngle(window.orientation);
  } else if (window.innerWidth > window.innerHeight) {
    angle = 90;
  }

  if (angle !== null && [0, 90, 180, 270].includes(angle)) {
    currentDeviceAngle = angle;
  }
}

function applyGravityOrientation(x, y, fromMotion = false) {
  if (!Number.isFinite(x) || !Number.isFinite(y)) return;

  const absX = Math.abs(x);
  const absY = Math.abs(y);
  // Ignore near-flat/diagonal positions; Z (screen-normal tilt) is deliberately
  // not used, so tipping the phone screen-down cannot trigger a 180° change.
  if (Math.max(absX, absY) < 5.5 || Math.min(absX, absY) > Math.max(absX, absY) * 0.72) return;

  let nextAngle;
  if (absY > absX) {
    nextAngle = y >= 0 ? 0 : 180;
  } else {
    nextAngle = x >= 0 ? 90 : 270;
  }

  if (fromMotion) hasMotionOrientation = true;
  if (nextAngle === currentDeviceAngle) return;
  currentDeviceAngle = nextAngle;
  hasSensorOrientation = true;
  lastSensorOrientationAt = Date.now();
}

function updateOrientationFromMotion(event) {
  const gravity = event.accelerationIncludingGravity;
  if (!gravity) return;
  // Only X/Y affect the result. The Z axis is intentionally ignored.
  applyGravityOrientation(gravity.x, gravity.y, true);
}

function updateOrientationFromSensor(beta, gamma) {
  // Euler angles are a fallback only. Prefer accelerationIncludingGravity,
  // which lets us ignore screen-normal tilt instead of confusing it with rotation.
  if (hasMotionOrientation || !Number.isFinite(beta) || !Number.isFinite(gamma)) return;

  const betaProjection = Math.sin(beta * Math.PI / 180);
  const gammaProjection = Math.sin(gamma * Math.PI / 180);
  const absBeta = Math.abs(betaProjection);
  const absGamma = Math.abs(gammaProjection);
  if (Math.max(absBeta, absGamma) < 0.62) return;

  let nextAngle = null;
  if (absBeta > absGamma * 1.25) {
    nextAngle = betaProjection >= 0 ? 0 : 180;
  } else if (absGamma > absBeta * 1.25) {
    nextAngle = gammaProjection > 0 ? 90 : 270;
  }

  if (nextAngle === null || nextAngle === currentDeviceAngle) return;
  currentDeviceAngle = nextAngle;
  hasSensorOrientation = true;
  lastSensorOrientationAt = Date.now();
}

function getPhysicalDeviceAngle() {
  // Real gravity-based handset orientation wins when available, even if the
  // embedded VK browser keeps its screen.orientation.angle locked at zero.
  if (hasMotionOrientation || hasSensorOrientation) return currentDeviceAngle;
  updateOrientationFromScreen();
  return currentDeviceAngle;
}

function getCaptureOrientationAngle(sourceWidth = video.videoWidth, sourceHeight = video.videoHeight) {
  const deviceAngle = getPhysicalDeviceAngle();

  // Native still photos from some Android cameras arrive as landscape pixels
  // without EXIF orientation. In landscape handset positions the sensor raster
  // already has the correct dimensions; only one of the two handset rotations
  // needs a 180° correction to keep the top edge upright.
  if (sourceWidth > sourceHeight) {
    if (deviceAngle === 90) return 180;
    if (deviceAngle === 270) return 0;
    return deviceAngle;
  }

  return normalizeAngle(deviceAngle);
}

function syncViewportAfterOrientationChange() {
  updateOrientationFromScreen();
}

window.addEventListener('orientationchange', syncViewportAfterOrientationChange);
if (window.screen && window.screen.orientation) {
  window.screen.orientation.addEventListener('change', syncViewportAfterOrientationChange);
}
if (window.DeviceMotionEvent) {
  window.addEventListener('devicemotion', updateOrientationFromMotion, true);
}
if (window.DeviceOrientationEvent) {
  window.addEventListener('deviceorientation', event => {
    updateOrientationFromSensor(event.beta, event.gamma);
  }, true);
}
updateOrientationFromScreen();

/* Elements */
const video = document.getElementById('camera');
const photo = document.getElementById('photo');
const photoModal = document.getElementById('photoModal');
const canvas = photo;
const cameraLoader = document.getElementById('cameraLoader');

const cameraInfoPanel = document.getElementById('cameraInfoPanel');
const roomHistoryItems = document.getElementById('roomHistoryItems');

const roomHistoryCache = new Map();

const btnCloseSheet = document.getElementById('btnCloseSheet');

let stream = null;

let torchArmed = false;

let selectedRoom = ALL_ROOMS[0];
let previewBlob = null;
let previewBlobPromise = null;

let snapTimer = null;

const pendingPhotoWrites = new Map();
let pendingPhotoWriteActive = false;
let pendingPhotoWriteTimer = null;

let isPreview = false;
let isVKReady = false;
let orientationPermissionAsked = false;
let orientationPermissionPromise = null;
const carouselItems = new Map();
let activeCarouselItem = null;

function escapeCameraHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

const CAMERA_GIH_MODE_LABELS = {
  dnd: 'DND',
  all_in_place: 'Всё на месте',
  all_out: 'Всё выложили',
  empty: 'Опустошён',
  not_checked: 'Не проверен'
};

const CAMERA_GIH_STATUS_LABELS = {
  replenished: 'Пополнено',
  in_place: 'На месте',
  out: 'Выложили',
  not_replenished: 'Не пополнено',
  pending: 'Не размечено'
};

function cameraHistorySummary(check) {
  if (check.type === 'emptied' || check.type === 'vk_emptied') {
    return '<span class="camera-history-operation is-empty">Опустошение</span>';
  }
  if (check.type !== 'gih') {
    return '<span class="camera-history-operation">Проверка</span>';
  }

  const mode = check.gihRoomStatus;
  if (mode) {
    return '<span class="camera-history-operation is-gih">GIH · ' +
      escapeCameraHtml(CAMERA_GIH_MODE_LABELS[mode] || mode) + '</span>';
  }

  const groups = {};
  (Array.isArray(check.gihItems) ? check.gihItems : []).forEach(item => {
    const status = item.itemStatus || 'pending';
    const name = item.productName || (item.product && item.product.name) || 'Продукт';
    if (!groups[status]) groups[status] = {};
    groups[status][name] = (groups[status][name] || 0) + 1;
  });
  const order = ['replenished', 'in_place', 'out', 'not_replenished', 'pending'];
  const details = order.filter(status => groups[status]).map(status => {
    const products = Object.entries(groups[status]).map(([name, qty]) =>
      escapeCameraHtml(name) + (qty > 1 ? ' ×' + qty : '')
    ).join(', ');
    return '<span class="camera-history-gih-status">' +
      escapeCameraHtml(CAMERA_GIH_STATUS_LABELS[status] || status) + ':</span> ' + products;
  });
  return '<span class="camera-history-operation is-gih">GIH</span>' +
    (details.length ? '<span class="camera-history-separator"> · </span>' + details.join('<span class="camera-history-separator"> · </span>') : '');
}

function cameraHistoryEntryHtml(check) {
  const date = new Date(check.checkDate || check.createdAt || '');
  const validDate = Number.isFinite(date.getTime());
  const dateText = validDate
    ? date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' ' +
      date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
    : 'Дата неизвестна';
  const note = String(check.notes || '').trim().replace(/\s+/g, ' ');
  return '<article class="camera-history-entry">' +
    '<div class="camera-history-date">' + escapeCameraHtml(dateText) + '</div>' +
    '<div class="camera-history-summary">' + cameraHistorySummary(check) + '</div>' +
    (note ? '<div class="camera-history-note">' + escapeCameraHtml(note) + '</div>' : '') +
    '</article>';
}

function renderRoomHistory(roomId) {
  const state = roomHistoryCache.get(Number(roomId));
  if (!state || state.loading) {
    roomHistoryItems.innerHTML = '<div class="camera-history-empty">Загрузка истории…</div>';
    return;
  }
  if (state.error) {
    roomHistoryItems.innerHTML = '<div class="camera-history-empty">Не удалось загрузить историю</div>';
    return;
  }
  if (!state.items.length) {
    roomHistoryItems.innerHTML = '<div class="camera-history-empty">Операций пока нет</div>';
    return;
  }
  roomHistoryItems.innerHTML = state.items.map(cameraHistoryEntryHtml).join('');
}

async function loadRoomHistory(room, force = false) {
  if (!room || !room.id) return;
  const roomId = Number(room.id);
  const current = roomHistoryCache.get(roomId);
  if (current && current.loading) return;
  if (current && current.loaded && !force && Date.now() - current.loadedAt < 15000) {
    if (selectedRoom && Number(selectedRoom.id) === roomId) renderRoomHistory(roomId);
    return;
  }

  roomHistoryCache.set(roomId, { loading: true, loaded: false, error: false, items: [], loadedAt: 0 });
  if (selectedRoom && Number(selectedRoom.id) === roomId) renderRoomHistory(roomId);
  try {
    const params = new URLSearchParams({
      operation: 'room',
      roomId: String(roomId),
      _t: String(Date.now())
    });
    const response = await fetch(API_BASE + '/checks/history?' + params.toString(), {
      headers: { Accept: 'application/json' },
      cache: 'no-store'
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    const items = Array.isArray(data) ? data : (Array.isArray(data.items) ? data.items : []);
    items.sort((a, b) => {
      const aTime = new Date(a.checkDate || a.createdAt || 0).getTime() || 0;
      const bTime = new Date(b.checkDate || b.createdAt || 0).getTime() || 0;
      return bTime - aTime || Number(b.id || 0) - Number(a.id || 0);
    });
    roomHistoryCache.set(roomId, {
      loading: false,
      loaded: true,
      error: false,
      items: items.slice(0, 3),
      loadedAt: Date.now()
    });
  } catch (error) {
    console.warn('[MINIBAR CAMERA] Не удалось загрузить историю номера:', error);
    roomHistoryCache.set(roomId, {
      loading: false,
      loaded: true,
      error: true,
      items: [],
      loadedAt: Date.now()
    });
  }
  if (selectedRoom && Number(selectedRoom.id) === roomId) renderRoomHistory(roomId);
}

function updateQueueDisplay() {
  queueCount.textContent = `В очереди: ${queueRemaining} номеров`;
}

function showMessage(text, duration = 1800) {
  message.textContent = text;
  message.classList.add('visible');
  clearTimeout(messageTimer);
  messageTimer = setTimeout(() => message.classList.remove('visible'), duration);
}

function setBusy(button, busy) {
  button.classList.toggle('busy', busy);
  button.setAttribute('aria-busy', String(busy));
}

async function initVK() {
  try {
    await bridge.send('VKWebAppInit');
    isVKReady = true;
  } catch (_) { isVKReady = false; }
}

function triggerHaptic() {
  try {
    if (isVKReady && bridge.supports('VKWebAppTapticSelectionChanged')) {
      bridge.send('VKWebAppTapticSelectionChanged');
      return;
    }
  } catch (_) {}
  try {
    if (navigator.vibrate) navigator.vibrate(8);
  } catch (_) {}
}

function ensureOrientationSensorPermission() {
  if (orientationPermissionAsked) {
    return orientationPermissionPromise || Promise.resolve('denied');
  }

  orientationPermissionAsked = true;
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      orientationPermissionPromise = DeviceOrientationEvent.requestPermission()
        .catch(() => 'denied');
    } else {
      orientationPermissionPromise = Promise.resolve('granted');
    }
  } catch (_) {
    orientationPermissionPromise = Promise.resolve('denied');
  }

  return orientationPermissionPromise;
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function waitForVideoFrame() {
  return new Promise(resolve => {
    if (typeof video.requestVideoFrameCallback === 'function') {
      video.requestVideoFrameCallback(() => resolve());
    } else {
      requestAnimationFrame(() => requestAnimationFrame(resolve));
    }
  });
}

async function waitForCameraReady(timeoutMs = 4500) {
  const deadline = Date.now() + timeoutMs;
  while (Date.now() < deadline) {
    if (video.videoWidth > 0 && video.videoHeight > 0 && video.readyState >= 2) {
      await waitForVideoFrame();
      return;
    }
    await wait(40);
  }
  throw new Error('Камера не успела подготовить изображение');
}

async function waitForOrientationToSettle() {
  const sensorTimestampBeforeWait = lastSensorOrientationAt;
  await (orientationPermissionPromise || Promise.resolve());

  const deadline = Date.now() + 420;
  while (Date.now() < deadline) {
    if (lastSensorOrientationAt > sensorTimestampBeforeWait) {
      await wait(60);
      return;
    }
    if (Date.now() - lastSensorOrientationAt < 900) {
      await wait(80);
      return;
    }
    await wait(40);
  }
}

function detectTorchSupport() {
  torchSupported = false;
  if (!videoTrack || typeof videoTrack.getCapabilities !== 'function') return;
  try {
    torchSupported = videoTrack.getCapabilities()?.torch === true;
  } catch (_) {
    torchSupported = false;
  }
}

async function setTorch(enabled) {
  if (!torchSupported || !videoTrack) return false;
  try {
    await videoTrack.applyConstraints({ advanced: [{ torch: enabled }] });
    return true;
  } catch (_) {
    return false;
  }
}

async function armTorch() {
  if (isPreview || !torchSupported) return torchArmed;
  if (torchArmed) return true;
  if (torchPromise) return torchPromise;

  torchPromise = setTorch(true).then(ok => {
    torchArmed = ok;
    torchPromise = null;
    return ok;
  });
  return torchPromise;
}

async function disarmTorch() {
  if (isCapturing) return;
  torchPromise = null;
  if (torchArmed || torchSupported) {
    torchArmed = false;
    setTorch(false);
  }
}

async function stopCamera() {
  torchArmed = false;
  torchPromise = null;
  if (stream) {
    for (const track of stream.getTracks()) {
      try { track.stop(); } catch (_) {}
    }
  }
  stream = null;
  videoTrack = null;
  torchSupported = false;
  video.srcObject = null;
  video.classList.remove('ready');
}

async function startCamera() {
  cameraInfoPanel.classList.add('hidden');
  cameraLoader.classList.remove('error', 'hidden');
  cameraLoader.style.opacity = '1';
  loaderSpinner.classList.remove('hidden');
  loaderRetry.classList.add('hidden');
  loaderTitle.textContent = 'Запуск камеры…';
  loaderSubtitle.textContent = 'Подготавливаю камеру и ориентацию снимка…';

  await stopCamera();

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } }
    });

    videoTrack = stream.getVideoTracks()[0] || null;
    if (!videoTrack) throw new Error('Камера не вернула видеопоток');

    video.srcObject = stream;
    await video.play();
    await waitForCameraReady();
    detectTorchSupport();
    video.classList.add('ready');

    cameraLoader.style.opacity = '0';
    setTimeout(() => cameraLoader.classList.add('hidden'), 200);
    return true;
  } catch (error) {
    await stopCamera();
    cameraLoader.classList.remove('hidden');
    cameraLoader.style.opacity = '1';
    cameraLoader.classList.add('error');
    loaderSpinner.classList.add('hidden');
    loaderRetry.classList.remove('hidden');
    loaderTitle.textContent = 'Не удалось открыть камеру';
    loaderSubtitle.textContent = 'Проверьте разрешение на камеру и повторите попытку.';
    return false;
  }
}

function drawSourceToCanvas(source, srcW, srcH, angle = 0) {
  if (!srcW || !srcH) throw new Error('Frame error');

  angle = normalizeAngle(angle);
  const quarterTurn = angle === 90 || angle === 270;
  canvas.width = quarterTurn ? srcH : srcW;
  canvas.height = quarterTurn ? srcW : srcH;

  const ctx = canvas.getContext('2d', { alpha: false });
  if (!ctx) throw new Error('Не удалось подготовить снимок');

  ctx.save();
  if (angle === 90) {
    ctx.translate(srcH, 0);
    ctx.rotate(Math.PI / 2);
  } else if (angle === 180) {
    ctx.translate(srcW, srcH);
    ctx.rotate(Math.PI);
  } else if (angle === 270) {
    ctx.translate(0, srcW);
    ctx.rotate(-Math.PI / 2);
  }
  ctx.drawImage(source, 0, 0, srcW, srcH);
  ctx.restore();
}

function drawRotatedVideoToCanvas(angle = getCaptureOrientationAngle()) {
  drawSourceToCanvas(video, video.videoWidth, video.videoHeight, angle);
}

/* Native still capture is consistently upside down in landscape in the VK WebView.
   Correct only the final landscape raster; portrait captures remain untouched. */
function correctNativeLandscapeCapture() {
  if (!canvas.width || !canvas.height || canvas.width <= canvas.height) return;

  const source = document.createElement('canvas');
  source.width = canvas.width;
  source.height = canvas.height;
  const sourceContext = source.getContext('2d', { alpha: false });
  const ctx = canvas.getContext('2d', { alpha: false });
  if (!sourceContext || !ctx) throw new Error('Не удалось подготовить снимок');

  sourceContext.drawImage(canvas, 0, 0);
  ctx.save();
  ctx.setTransform(-1, 0, 0, -1, canvas.width, canvas.height);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(source, 0, 0);
  ctx.restore();
}

/* Prefer a full-resolution still photo when the browser supports it.
   Decode EXIF orientation first, then apply the physical-phone turn exactly once. */
async function prepareCameraFocus() {
  if (!videoTrack || typeof videoTrack.getCapabilities !== 'function') return;
  try {
    const capabilities = videoTrack.getCapabilities();
    const modes = Array.isArray(capabilities.focusMode) ? capabilities.focusMode : [];
    if (modes.includes('continuous')) {
      await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      await wait(250);
    } else if (modes.includes('single-shot')) {
      await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
      await wait(350);
    }
  } catch (error) {
    // Some WebViews expose focus capabilities but reject focus constraints.
    // ImageCapture can still run the camera's normal autofocus sequence.
    console.debug('[MINIBAR CAMERA] Explicit autofocus constraint unavailable:', error);
  }
}

/* Read EXIF Orientation ourselves, then remove the EXIF segment before decoding.
   This prevents browser auto-rotation and lets us apply orientation exactly once. */
function readExifOrientation(bytes, payload, segmentEnd) {
  const exifSignature = [0x45, 0x78, 0x69, 0x66, 0x00, 0x00];
  if (payload + 14 > segmentEnd ||
      !exifSignature.every((value, i) => bytes[payload + i] === value)) return null;

  const tiff = payload + 6;
  const byteOrder = String.fromCharCode(bytes[tiff], bytes[tiff + 1]);
  const littleEndian = byteOrder === 'II';
  if (!littleEndian && byteOrder !== 'MM') return null;

  const u16 = offset => {
    if (offset < tiff || offset + 2 > segmentEnd) return null;
    return littleEndian
      ? bytes[offset] | (bytes[offset + 1] << 8)
      : (bytes[offset] << 8) | bytes[offset + 1];
  };
  const u32 = offset => {
    if (offset < tiff || offset + 4 > segmentEnd) return null;
    return littleEndian
      ? (bytes[offset] | (bytes[offset + 1] << 8) |
        (bytes[offset + 2] << 16) | (bytes[offset + 3] << 24)) >>> 0
      : ((bytes[offset] << 24) | (bytes[offset + 1] << 16) |
        (bytes[offset + 2] << 8) | bytes[offset + 3]) >>> 0;
  };

  if (u16(tiff + 2) !== 42) return null;
  const ifdOffset = u32(tiff + 4);
  if (ifdOffset === null) return null;
  const ifd = tiff + ifdOffset;
  const entryCount = u16(ifd);
  if (entryCount === null) return null;

  for (let i = 0; i < entryCount; i++) {
    const entry = ifd + 2 + i * 12;
    const tag = u16(entry);
    if (tag === null || entry + 12 > segmentEnd) return null;
    if (tag !== 0x0112) continue;

    const type = u16(entry + 2);
    const count = u32(entry + 4);
    if (type !== 3 || count !== 1) return null;
    const orientation = u16(entry + 8);
    return orientation >= 1 && orientation <= 8 ? orientation : null;
  }
  return null;
}

async function stripJpegExifMetadata(blob) {
  const bytes = new Uint8Array(await blob.arrayBuffer());
  if (bytes.length < 4 || bytes[0] !== 0xff || bytes[1] !== 0xd8) {
    return { blob, orientation: null };
  }

  const parts = [bytes.subarray(0, 2)];
  let offset = 2;
  let removedExif = false;
  let orientation = null;

  while (offset < bytes.length) {
    if (bytes[offset] !== 0xff) throw new Error('Не удалось прочитать заголовок JPEG');

    const markerStart = offset;
    while (offset < bytes.length && bytes[offset] === 0xff) offset++;
    if (offset >= bytes.length) throw new Error('Повреждённый заголовок JPEG');

    const marker = bytes[offset++];
    if (marker === 0xda || marker === 0xd9) {
      parts.push(bytes.subarray(markerStart));
      return {
        blob: removedExif ? new Blob(parts, { type: blob.type || 'image/jpeg' }) : blob,
        orientation
      };
    }

    if (marker === 0x01 || (marker >= 0xd0 && marker <= 0xd7)) {
      parts.push(bytes.subarray(markerStart, offset));
      continue;
    }

    if (offset + 2 > bytes.length) throw new Error('Повреждённый сегмент JPEG');
    const segmentLength = (bytes[offset] << 8) | bytes[offset + 1];
    const segmentEnd = offset + segmentLength;
    if (segmentLength < 2 || segmentEnd > bytes.length) {
      throw new Error('Некорректная длина сегмента JPEG');
    }

    const payload = offset + 2;
    const isExifSegment = marker === 0xe1 &&
      bytes[payload] === 0x45 && bytes[payload + 1] === 0x78 &&
      bytes[payload + 2] === 0x69 && bytes[payload + 3] === 0x66 &&
      bytes[payload + 4] === 0x00 && bytes[payload + 5] === 0x00;

    if (isExifSegment) {
      if (orientation === null) orientation = readExifOrientation(bytes, payload, segmentEnd);
      removedExif = true;
    } else {
      parts.push(bytes.subarray(markerStart, segmentEnd));
    }
    offset = segmentEnd;
  }

  return {
    blob: removedExif ? new Blob(parts, { type: blob.type || 'image/jpeg' }) : blob,
    orientation
  };
}

function drawExifOrientedToCanvas(source, srcW, srcH, orientation) {
  if (!srcW || !srcH) throw new Error('Frame error');
  const turn = orientation >= 5 && orientation <= 8;
  canvas.width = turn ? srcH : srcW;
  canvas.height = turn ? srcW : srcH;

  const ctx = canvas.getContext('2d', { alpha: false });
  if (!ctx) throw new Error('Не удалось подготовить снимок');

  // EXIF values 1–8 include rotations and mirrored orientations.
  switch (orientation) {
    case 2: ctx.setTransform(-1, 0, 0, 1, srcW, 0); break;
    case 3: ctx.setTransform(-1, 0, 0, -1, srcW, srcH); break;
    case 4: ctx.setTransform(1, 0, 0, -1, 0, srcH); break;
    case 5: ctx.setTransform(0, 1, 1, 0, 0, 0); break;
    case 6: ctx.setTransform(0, 1, -1, 0, srcH, 0); break;
    case 7: ctx.setTransform(0, -1, -1, 0, srcH, srcW); break;
    case 8: ctx.setTransform(0, -1, 1, 0, 0, srcW); break;
    default: ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  ctx.drawImage(source, 0, 0, srcW, srcH);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

async function captureStillPhotoToCanvas() {
  if (typeof window.ImageCapture !== 'function' ||
      typeof window.createImageBitmap !== 'function' ||
      !videoTrack) {
    return false;
  }

  let bitmap = null;
  try {
    const capture = new window.ImageCapture(videoTrack);
    const photoBlob = await capture.takePhoto();
    if (!photoBlob || !photoBlob.size) throw new Error('Камера вернула пустое фото');

    const decoded = await stripJpegExifMetadata(photoBlob);
    bitmap = await window.createImageBitmap(decoded.blob);
    if (decoded.orientation !== null) {
      drawExifOrientedToCanvas(bitmap, bitmap.width, bitmap.height, decoded.orientation);
    } else {
      drawSourceToCanvas(
        bitmap,
        bitmap.width,
        bitmap.height,
        getCaptureOrientationAngle(bitmap.width, bitmap.height)
      );
    }
    return true;
  } catch (error) {
    console.warn('[MINIBAR CAMERA] Native still capture unavailable; falling back to video frame:', error);
    return false;
  } finally {
    if (bitmap && typeof bitmap.close === 'function') bitmap.close();
  }
}

function encodePreviewBlob() {
  previewBlob = null;

  // Keep the preview at full camera resolution, but upload a reasonably sized
  // JPEG. Hotel-room evidence remains readable while transfer time and mobile
  // data usage drop substantially.
  previewBlobPromise = new Promise(resolve => {
    if (!canvas.width || !canvas.height) {
      resolve(null);
      return;
    }

    const maxEdge = 1600;
    const scale = Math.min(1, maxEdge / Math.max(canvas.width, canvas.height));
    const uploadCanvas = document.createElement('canvas');
    uploadCanvas.width = Math.max(1, Math.round(canvas.width * scale));
    uploadCanvas.height = Math.max(1, Math.round(canvas.height * scale));

    const context = uploadCanvas.getContext('2d', { alpha: false });
    if (!context) {
      resolve(null);
      return;
    }

    context.drawImage(canvas, 0, 0, uploadCanvas.width, uploadCanvas.height);
    uploadCanvas.toBlob(
      blob => {
        previewBlob = blob && blob.size ? blob : null;
        resolve(previewBlob);
      },
      'image/jpeg',
      0.82
    );
  });

  return previewBlobPromise;
}

/* Carousel */
function buildCarousel(preferredNumber = ALL_ROOMS[0]?.number) {
  carousel.innerHTML = '';
  carouselItems.clear();
  const fragment = document.createDocumentFragment();

  ALL_ROOMS.forEach(room => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'num-item';
    el.dataset.number = room.number;
    el.textContent = room.number;
    carouselItems.set(room.number, el);
    fragment.appendChild(el);
  });

  carousel.appendChild(fragment);

  sheetPeekTitle.textContent = `Показать все номера (${ALL_ROOMS.length})`;
  sheetSubtitle.textContent = `${ALL_ROOMS.length} номеров из базы данных`;

  requestAnimationFrame(() => {
    const targetNumber = ROOM_BY_NUMBER.has(String(preferredNumber))
      ? String(preferredNumber)
      : ALL_ROOMS[0]?.number;
    if (targetNumber != null) selectRoomByNumber(targetNumber, false, 'auto');
  });
}

function updateSelectedRoomState(room, vibrate = false) {
  if (!room) return;
  const changed = selectedRoom !== room;
  selectedRoom = room;

  if (activeCarouselItem) activeCarouselItem.classList.remove('active');
  const currentItem = carouselItems.get(room.number);
  if (currentItem) {
    currentItem.classList.add('active');
    activeCarouselItem = currentItem;
  }

  descRoomTitle.textContent = 'Номер ' + room.number;
  const categoryLabel = room.type === 'suite' ? 'Люкс' : 'Стандарт';
  descRoomTag.textContent = room.floor + ' этаж · ' + categoryLabel;
  descRoomTag.className = room.type === 'suite' ? 'desc-tag suite' : 'desc-tag';

  void loadRoomHistory(room, changed);
  updateDrawerSelectedChip(room.number);
  if (vibrate && changed) triggerHaptic();
}

function selectRoomByNumber(numStr, vibrate = true, behavior = 'smooth') {
  const room = ROOM_BY_NUMBER.get(String(numStr));
  if (!room) return;

  const el = carouselItems.get(room.number);
  if (el) {
    updateSelectedRoomState(room, vibrate);
    el.scrollIntoView({ behavior, inline: 'center', block: 'nearest' });
  }
}

function updateNumberFromScroll() {
  const items = carousel.querySelectorAll('.num-item');
  if (!items.length) return;

  const carouselRect = carousel.getBoundingClientRect();
  const center = carouselRect.left + carouselRect.width / 2;

  let closest = null;
  let minDistance = Infinity;

  items.forEach(el => {
    const rect = el.getBoundingClientRect();
    const itemCenter = rect.left + rect.width / 2;
    const distance = Math.abs(itemCenter - center);

    if (distance < minDistance) {
      minDistance = distance;
      closest = el;
    }
  });

  if (closest) {
    const room = ROOM_BY_NUMBER.get(closest.dataset.number);
    if (room) updateSelectedRoomState(room, true);
  }
}

carousel.addEventListener('scroll', () => {
  updateNumberFromScroll();
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => updateNumberFromScroll(), 80);
}, { passive: true });

carousel.addEventListener('click', event => {
  const item = event.target.closest('.num-item');
  if (!item) return;
  selectRoomByNumber(item.dataset.number);
});

/* Bottom Sheet Drawer */
let isSheetOpen = false;
let startY = 0;
let currentY = 0;
let isDragging = false;
let sheetHeight = window.innerHeight * 0.82;
let rafId = null;

function renderDrawerRooms(filterQuery = '') {
  const q = filterQuery.trim().toLowerCase();
  const parts = [];
  let hasAny = false;

  for (const floorNum of FLOORS) {
    const floorRooms = ALL_ROOMS.filter(r => r.floor === floorNum && (!q || r.number.includes(q)));
    if (!floorRooms.length) continue;
    hasAny = true;

    parts.push(`<div class="floor-section">
      <div class="floor-header">
        <span>${floorNum} этаж</span>
        <span class="floor-stats">${floorRooms.length} номеров</span>
      </div>
      <div class="room-grid">${floorRooms.map(room => `
        <div class="room-chip ${room.expiryStatus === 'empty' ? 'empty-room' : ''} ${room.number === selectedRoom?.number ? 'selected' : ''}" data-room-number="${room.number}">
          <span>${room.number}</span>
        </div>`).join('')}
      </div>
    </div>`);
  }

  sheetContent.innerHTML = hasAny
    ? parts.join('')
    : `<div style="text-align: center; color: var(--text-dim); padding: 40px 0;">Номера не найдены</div>`;
}

function updateDrawerSelectedChip(numStr) {
  const chips = sheetContent.querySelectorAll('.room-chip');
  chips.forEach(chip => {
    const isSelected = chip.dataset.roomNumber === numStr;
    const room = ROOM_BY_NUMBER.get(chip.dataset.roomNumber);
    chip.classList.toggle('selected', isSelected);
    chip.classList.toggle('empty-room', room?.expiryStatus === 'empty');
  });
}

/* Subscribe to the same server-sent live-change stream as the main website.
   Room writes from the VK bot are published by the API after the DB transaction
   commits, and the Mini App refreshes only when a relevant event arrives. */
let roomSyncInProgress = false;
let roomSyncPending = false;
let roomEventsSource = null;
const roomEventsClientId = 'miniapp-' + Date.now().toString(36) + '-' +
  Math.random().toString(36).slice(2, 8);

async function syncRoomData() {
  if (roomSyncInProgress) {
    roomSyncPending = true;
    return;
  }
  if (document.visibilityState !== 'visible') {
    roomSyncPending = true;
    return;
  }

  roomSyncInProgress = true;
  try {
    const response = await fetch(API_BASE + '/miniapp/queue', {
      method: 'GET',
      headers: { Accept: 'application/json' },
      cache: 'no-store'
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);

    const data = await response.json();
    if (!Array.isArray(data?.rooms) || !data.rooms.length) return;

    const freshRooms = data.rooms
      .map(room => ({
        ...room,
        number: String(room.number),
        floor: Number(room.floor),
        type: String(room.category || '').toLowerCase().includes('люкс') ||
              String(room.category || '').toLowerCase().includes('suite')
          ? 'suite'
          : 'standard'
      }))
      .sort((a, b) => Number(a.number) - Number(b.number));

    const structureChanged = freshRooms.length !== ALL_ROOMS.length ||
      freshRooms.some((fresh, index) => {
        const current = ALL_ROOMS[index];
        return !current ||
          current.id !== fresh.id ||
          current.number !== fresh.number ||
          current.floor !== fresh.floor ||
          current.category !== fresh.category;
      });

    const selectedNumber = String(selectedRoom?.number || freshRooms[0].number);
    if (structureChanged) {
      ALL_ROOMS = freshRooms;
      ROOM_BY_NUMBER = new Map(ALL_ROOMS.map(room => [room.number, room]));
      FLOORS = [...new Set(ALL_ROOMS.map(room => room.floor))].sort((a, b) => a - b);
      buildCarousel(selectedNumber);
    } else {
      // Preserve object identity so the selected room and camera controls remain intact.
      freshRooms.forEach((fresh, index) => Object.assign(ALL_ROOMS[index], fresh));
      ROOM_BY_NUMBER = new Map(ALL_ROOMS.map(room => [room.number, room]));
    }

    selectedRoom = ROOM_BY_NUMBER.get(selectedNumber) || ALL_ROOMS[0];
    if (selectedRoom) updateSelectedRoomState(selectedRoom, false);
    queueRemaining = Number.isFinite(data.remaining) ? data.remaining : ALL_ROOMS.length;
    updateQueueDisplay();
    renderDrawerRooms(sheetSearch.value);
  } catch (error) {
    console.warn('[MINIBAR LIVE SYNC] Не удалось обновить номера:', error);
  } finally {
    roomSyncInProgress = false;
    if (roomSyncPending) {
      roomSyncPending = false;
      if (document.visibilityState === 'visible') void syncRoomData();
    }
  }
}

function startRoomLiveSync() {
  if (!('EventSource' in window)) {
    console.warn('[MINIBAR LIVE SYNC] EventSource не поддерживается этим браузером');
    return;
  }
  if (roomEventsSource && roomEventsSource.readyState !== EventSource.CLOSED) return;

  const separator = API_BASE.includes('?') ? '&' : '?';
  roomEventsSource = new EventSource(
    API_BASE + '/events' + separator + 'clientId=' + encodeURIComponent(roomEventsClientId)
  );

  roomEventsSource.addEventListener('open', () => {
    console.info('[MINIBAR LIVE SYNC] Подключено к общему потоку событий сайта');
  });

  roomEventsSource.addEventListener('data.changed', event => {
    try {
      const change = JSON.parse(event.data);
      const domains = Array.isArray(change.domains) ? change.domains : ['all'];
      if (domains.includes('all') || domains.includes('miniapp') || domains.includes('rooms')) {
        void syncRoomData();
      }
    } catch (error) {
      console.warn('[MINIBAR LIVE SYNC] Некорректное событие:', error);
      void syncRoomData();
    }
  });

  // Initial sync and replay-gap recovery are sent by the server's live stream.
  roomEventsSource.addEventListener('sync.required', () => {
    void syncRoomData();
  });

  roomEventsSource.addEventListener('error', () => {
    // EventSource reconnects automatically and replays missed events when possible.
    console.warn('[MINIBAR LIVE SYNC] Соединение временно потеряно; переподключение автоматически');
  });
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && roomSyncPending) {
    roomSyncPending = false;
    void syncRoomData();
  }
});

function openSheet() {
  isSheetOpen = true;
  bottomSheet.classList.remove('dragging');
  sheetOverlay.classList.add('active');
  bottomSheet.classList.add('open');
  bottomSheet.style.transform = 'translate3d(0, 0, 0)';
  triggerHaptic();
}

function closeSheet() {
  isSheetOpen = false;
  bottomSheet.classList.remove('dragging');
  sheetOverlay.classList.remove('active');
  bottomSheet.classList.remove('open');
  bottomSheet.style.transform = 'translate3d(0, calc(100% - 46px), 0)';
}

function updateSheetTransform() {
  if (!isDragging) return;
  const deltaY = currentY - startY;

  if (!isSheetOpen) {
    if (deltaY < 0) {
      const translateY = Math.max(0, sheetHeight + deltaY);
      bottomSheet.style.transform = `translate3d(0, ${translateY}px, 0)`;
    }
  } else {
    if (deltaY > 0) {
      bottomSheet.style.transform = `translate3d(0, ${deltaY}px, 0)`;
    }
  }
}

sheetHandleArea.addEventListener('touchstart', e => {
  startY = e.touches[0].clientY;
  currentY = startY;
  isDragging = true;
  sheetHeight = bottomSheet.offsetHeight;
  bottomSheet.classList.add('dragging');
}, { passive: true });

window.addEventListener('touchmove', e => {
  if (!isDragging) return;
  currentY = e.touches[0].clientY;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(updateSheetTransform);
}, { passive: true });

window.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  bottomSheet.classList.remove('dragging');

  const deltaY = currentY - startY;
  if (!isSheetOpen) {
    if (deltaY < -40) openSheet();
    else closeSheet();
  } else {
    if (deltaY > 50) closeSheet();
    else openSheet();
  }
});

sheetHandleArea.addEventListener('click', () => {
  if (isSheetOpen) closeSheet();
  else openSheet();
});

btnCloseSheet.addEventListener('click', closeSheet);
sheetOverlay.addEventListener('click', closeSheet);
sheetSearch.addEventListener('input', e => renderDrawerRooms(e.target.value));
sheetContent.addEventListener('click', event => {
  const chip = event.target.closest('.room-chip');
  if (!chip) return;
  selectRoomByNumber(chip.dataset.roomNumber, true);
  closeSheet();
});

/* Actions */
async function takePhoto() {
  if (isCapturing || isPreview) return;

  isCapturing = true;
  setBusy(captureBtn, true);
  triggerHaptic();

  try {
    await ensureOrientationSensorPermission();

    // Opening a stream only when requested avoids keeping the camera, sensor
    // pipeline and torch awake while the user is reviewing/sending images.
    if (!videoTrack) {
      const started = await startCamera();
      if (!started || !videoTrack) throw new Error('Не удалось открыть камеру');
    }

    await waitForCameraReady();

    // The live view is now visible. Add a short composition pause so the user
    // can move the phone into the intended portrait/landscape angle.
    await wait(450);
    await waitForOrientationToSettle();

    if (torchSupported) await armTorch();
    // Give autofocus and the torch time to settle before the exposure.
    if (torchArmed) {
      await waitForVideoFrame();
      await wait(350);
    } else {
      await waitForVideoFrame();
      await wait(180);
    }

    // Request autofocus where supported, then prefer a full-resolution camera photo.
    await prepareCameraFocus();
    const nativeCaptureSucceeded = await captureStillPhotoToCanvas();
    if (!nativeCaptureSucceeded) {
      drawRotatedVideoToCanvas(
        getCaptureOrientationAngle(video.videoWidth, video.videoHeight)
      );
    } else {
      // Keep the native still's EXIF handling, then correct the observed
      // 180° landscape inversion in VK's WebView. Portrait output is unchanged.
      correctNativeLandscapeCapture();
    }
    showPreviewFromCanvas();
    previewRequestId = String(Math.floor(Math.random() * 2147483647) + 1);
    encodePreviewBlob();
  } catch (error) {
    console.warn('[MINIBAR CAMERA] Capture failed:', error);
    showMessage(error?.message || 'Не удалось сделать снимок', 3500);
  } finally {
    try {
      if (videoTrack && torchSupported) await setTorch(false);
    } catch (_) {}
    await stopCamera();
    isCapturing = false;
    setBusy(captureBtn, false);
    torchArmed = false;
    torchPromise = null;
    if (!isPreview && !cameraLoader.classList.contains('error')) showCameraStandby();
  }
}

captureBtn.addEventListener('pointerdown', () => {
  void ensureOrientationSensorPermission();
}, { passive: true });
captureBtn.addEventListener('pointercancel', disarmTorch);
captureBtn.addEventListener('click', takePhoto);
btnRetake.addEventListener('click', () => { resetPhoto(); triggerHaptic(); });

async function sendPhotoToServer(blobFile, roomNum, requestId) {
  const formData = new FormData();
  formData.append('photo', blobFile, 'photo.jpg');
  formData.append('room', roomNum);
  if (requestId) formData.append('random_id', requestId);
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 60000);
    let res;
    try {
      res = await fetch('/minibar-os/vk-proxy/send-photo', {
        method: 'POST',
        body: formData,
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeout);
    }

    let data;
    try {
      data = await res.json();
    } catch {
      return {
        ok: false,
        error: 'Сервис отправки вернул некорректный ответ (HTTP ' + res.status + ')'
      };
    }

    if (!res.ok || !data?.ok) {
      return {
        ok: false,
        error: data?.error || 'Не удалось отправить фото (HTTP ' + res.status + ')'
      };
    }

    return {
      ok: true, mode: data.mode || 'photo',
      site_synced: data.site_synced !== false,
      site_sync_error: data.site_sync_error || ''
    };
  } catch (err) {
    return { ok: false, error: 'Сбой сети: ' + err.message };
  }
}

const PHOTO_QUEUE_DB_NAME = 'minibar-miniapp-photo-queue-v1';
const PHOTO_QUEUE_STORE_NAME = 'photos';

function openPhotoQueueDb() {
  if (!window.indexedDB) {
    return Promise.reject(new Error('Браузер не поддерживает надёжную очередь фото'));
  }

  if (!photoQueueDbPromise) {
    photoQueueDbPromise = new Promise((resolve, reject) => {
      const request = window.indexedDB.open(PHOTO_QUEUE_DB_NAME, 1);

      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(PHOTO_QUEUE_STORE_NAME)) {
          db.createObjectStore(PHOTO_QUEUE_STORE_NAME, { keyPath: 'id' });
        }
      };

      request.onsuccess = () => {
        const db = request.result;
        db.onversionchange = () => {
          db.close();
          photoQueueDbPromise = null;
        };
        resolve(db);
      };

      request.onerror = () => {
        photoQueueDbPromise = null;
        reject(request.error || new Error('Не удалось открыть очередь фото'));
      };

      request.onblocked = () => {
        console.warn('[MINIBAR PHOTO QUEUE] Открытие IndexedDB заблокировано');
      };
    });
  }

  return photoQueueDbPromise;
}

function photoQueueDbAction(mode, action, value) {
  return openPhotoQueueDb().then(db => new Promise((resolve, reject) => {
    let tx;
    try {
      tx = db.transaction(PHOTO_QUEUE_STORE_NAME, mode);
    } catch (error) {
      reject(error);
      return;
    }

    const store = tx.objectStore(PHOTO_QUEUE_STORE_NAME);
    let request;

    if (action === 'getAll') request = store.getAll();
    else if (action === 'put') request = store.put(value);
    else if (action === 'delete') request = store.delete(value);
    else {
      reject(new Error('Неизвестная операция очереди фото'));
      return;
    }

    let result;
    request.onsuccess = () => { result = request.result; };
    request.onerror = () => reject(request.error || new Error('Ошибка хранилища очереди фото'));
    tx.oncomplete = () => resolve(action === 'getAll' ? (result || []) : true);
    tx.onerror = () => reject(tx.error || request.error || new Error('Не удалось сохранить очередь фото'));
    tx.onabort = () => reject(tx.error || new Error('Сохранение очереди фото прервано'));
  }));
}

function setUploadStatus(text, type = 'pending', hideAfter = 0) {
  if (photoQueueStatusTimer) clearTimeout(photoQueueStatusTimer);
  photoQueueStatusTimer = null;

  uploadStatus.textContent = text || '';
  uploadStatus.className = text
    ? 'upload-status visible ' + type
    : 'upload-status';

  if (text && hideAfter > 0) {
    const expectedText = text;
    photoQueueStatusTimer = setTimeout(() => {
      if (uploadStatus.textContent === expectedText) {
        uploadStatus.textContent = '';
        uploadStatus.className = 'upload-status';
      }
      photoQueueStatusTimer = null;
    }, hideAfter);
  }
}

function sortPhotoQueue(items) {
  return items.sort((a, b) =>
    (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0) ||
    String(a.id).localeCompare(String(b.id))
  );
}

async function queuePhotoForUpload(roomNumber, blob, requestId) {
  let stableRequestId = Number(requestId);
  if (!Number.isInteger(stableRequestId) || stableRequestId < 1 || stableRequestId > 2147483647) {
    stableRequestId = Math.floor(Math.random() * 2147483647) + 1;
  }

  const now = Date.now();
  const item = {
    id: String(now) + '-' + stableRequestId + '-' + Math.random().toString(36).slice(2, 9),
    roomNumber: String(roomNumber),
    requestId: stableRequestId,
    blob,
    createdAt: now,
    attempts: 0,
    nextAttemptAt: 0,
    lastError: ''
  };

  await photoQueueDbAction('readwrite', 'put', item);
  return item;
}

function schedulePendingPhotoWriteRetry(delay = 3000) {
  if (pendingPhotoWriteTimer) clearTimeout(pendingPhotoWriteTimer);
  pendingPhotoWriteTimer = setTimeout(() => {
    pendingPhotoWriteTimer = null;
    void flushPendingPhotoWrites();
  }, Math.max(500, delay));
}

async function flushPendingPhotoWrites() {
  if (pendingPhotoWriteActive || !pendingPhotoWrites.size) return;
  pendingPhotoWriteActive = true;

  try {
    for (const [id, pending] of pendingPhotoWrites) {
      let blob;
      try {
        blob = await pending.blobPromise;
      } catch (error) {
        console.warn('[MINIBAR PHOTO QUEUE] Image encoding failed:', error);
      }

      if (!blob || !blob.size) {
        pendingPhotoWrites.delete(id);
        showMessage('Не удалось подготовить фото №' + pending.roomNumber + '. Сделайте снимок ещё раз.', 4500);
        setUploadStatus('Не удалось подготовить фото №' + pending.roomNumber, 'error');
        continue;
      }

      try {
        await queuePhotoForUpload(pending.roomNumber, blob, pending.requestId);
        pendingPhotoWrites.delete(id);
        setUploadStatus(
          'Фото №' + pending.roomNumber + ' сохранено в очереди. Отправляю в фоне…',
          'pending'
        );
      } catch (error) {
        console.warn('[MINIBAR PHOTO QUEUE] Background save will retry:', error);
        setUploadStatus(
          'Фото №' + pending.roomNumber + ' ожидает сохранения в очередь; повторяю автоматически.',
          'error'
        );
        schedulePendingPhotoWriteRetry(3000);
        return;
      }
    }

    if (!pendingPhotoWrites.size) void processPhotoQueue();
  } finally {
    pendingPhotoWriteActive = false;
  }
}

function formatPhotoRetryDelay(ms) {
  if (ms >= 60000) return Math.ceil(ms / 60000) + ' мин.';
  return Math.max(1, Math.ceil(ms / 1000)) + ' сек.';
}

function schedulePhotoQueueRetry(delay) {
  if (photoQueueRetryTimer) clearTimeout(photoQueueRetryTimer);
  photoQueueRetryTimer = setTimeout(() => {
    photoQueueRetryTimer = null;
    void processPhotoQueue();
  }, Math.max(250, delay));
}

async function processPhotoQueue() {
  if (photoQueueWorkerActive) return;

  if (photoQueueRetryTimer) {
    clearTimeout(photoQueueRetryTimer);
    photoQueueRetryTimer = null;
  }

  photoQueueWorkerActive = true;
  let sentAny = false;

  try {
    while (true) {
      const items = sortPhotoQueue(await photoQueueDbAction('readonly', 'getAll'));

      if (!items.length) {
        if (sentAny) setUploadStatus('Все фото отправлены', 'success', 2500);
        return;
      }

      if (navigator.onLine === false) {
        setUploadStatus(
          'Нет сети. ' + items.length + ' фото сохранено; отправка продолжится после восстановления связи.',
          'error'
        );
        return;
      }

      const item = items[0];
      const waitMs = Math.max(0, (Number(item.nextAttemptAt) || 0) - Date.now());
      if (waitMs > 0) {
        const retryText = 'Фото №' + item.roomNumber + ' ожидает повторной отправки через ' +
          formatPhotoRetryDelay(waitMs) + '. В очереди: ' + items.length + '.';
        setUploadStatus(retryText, item.lastError ? 'error' : 'pending');
        schedulePhotoQueueRetry(waitMs);
        return;
      }

      setUploadStatus(
        'Отправка фото №' + item.roomNumber +
          (items.length > 1 ? ' · ещё в очереди: ' + (items.length - 1) : '…'),
        'pending'
      );

      const result = await sendPhotoToServer(item.blob, item.roomNumber, item.requestId);

      if (result.ok) {
        // Keep the same VK random_id on retries. If the response was lost after
        // VK accepted the message, reusing the ID helps avoid duplicate messages.
        await photoQueueDbAction('readwrite', 'delete', item.id);
        sentAny = true;

        if (result.site_synced === false) {
          console.warn('[MINIBAR PHOTO QUEUE] Фото отправлено в VK, но сайт не синхронизирован:', result.site_sync_error);
          showMessage(
            'Фото №' + item.roomNumber + ' отправлено в VK, но сайт не обновился',
            4500
          );
        }

        continue;
      }

      const attempts = (Number(item.attempts) || 0) + 1;
      const retryDelay = Math.min(1000 * Math.pow(2, Math.min(attempts - 1, 6)), 60000);
      const updatedItem = {
        ...item,
        attempts,
        nextAttemptAt: Date.now() + retryDelay,
        lastError: result.error || 'Неизвестная ошибка отправки'
      };

      await photoQueueDbAction('readwrite', 'put', updatedItem);
      setUploadStatus(
        'Фото №' + item.roomNumber + ' пока не отправлено. Повтор через ' +
          formatPhotoRetryDelay(retryDelay) + '; файл сохранён.',
        'error'
      );
      schedulePhotoQueueRetry(retryDelay);
      return;
    }
  } catch (error) {
    console.error('[MINIBAR PHOTO QUEUE] Ошибка обработки очереди:', error);
    setUploadStatus(
      'Очередь фото сохранена. Ошибка обработки: ' + (error.message || 'неизвестная ошибка'),
      'error'
    );
  } finally {
    photoQueueWorkerActive = false;
  }
}

async function restorePhotoUploadQueue() {
  try {
    const items = sortPhotoQueue(await photoQueueDbAction('readonly', 'getAll'));
    if (!items.length) return;

    setUploadStatus('Сохранено фото для отправки: ' + items.length + '. Продолжаю отправку…', 'pending');
    void processPhotoQueue();
  } catch (error) {
    console.error('[MINIBAR PHOTO QUEUE] Не удалось восстановить очередь:', error);
    setUploadStatus('Не удалось открыть сохранённую очередь фото. Текущие снимки не будут приняты без сохранения.', 'error');
  }
}

window.addEventListener('online', () => {
  if (photoQueueRetryTimer) clearTimeout(photoQueueRetryTimer);
  photoQueueRetryTimer = null;
  if (pendingPhotoWriteTimer) clearTimeout(pendingPhotoWriteTimer);
  pendingPhotoWriteTimer = null;
  void flushPendingPhotoWrites();
  void processPhotoQueue();
});

window.addEventListener('offline', async () => {
  try {
    const items = await photoQueueDbAction('readonly', 'getAll');
    if (items.length) {
      setUploadStatus(
        'Нет сети. ' + items.length + ' фото сохранено; отправка продолжится после восстановления связи.',
        'error'
      );
    }
  } catch (_) {}
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') void processPhotoQueue();
});

btnSend.addEventListener('click', () => {
  if (!isPreview || btnSend.classList.contains('busy')) return;

  const roomNumber = String(selectedRoom?.number || '').trim();
  const requestId = previewRequestId;
  const blobPromise = Promise.resolve(
    previewBlob || (previewBlobPromise ? previewBlobPromise : null)
  );
  if (!roomNumber || (!previewBlob && !previewBlobPromise)) {
    showMessage('Не удалось подготовить фото. Попробуйте переснять.', 3500);
    return;
  }

  // Close the preview immediately. Encoding and IndexedDB persistence continue
  // in the background while the user selects the next room and takes another photo.
  const pendingId = String(Date.now()) + '-' + String(requestId || Math.random());
  pendingPhotoWrites.set(pendingId, { roomNumber, requestId, blobPromise });
  triggerHaptic();
  showMessage('Фото №' + roomNumber + ' принято — можно снимать следующее', 2200);
  setUploadStatus('Подготовка фото №' + roomNumber + ' в фоне…', 'pending');
  resetPhoto();
  void flushPendingPhotoWrites();
});

btnEmpty.addEventListener('click', async () => {
  if (btnEmpty.classList.contains('busy')) return;

  if (!selectedRoom?.number) {
    showMessage('Сначала выберите номер');
    return;
  }

  const roomNumber = String(selectedRoom.number);
  const requestMessage = roomNumber + ' опустошён';
  setBusy(btnEmpty, true);

  try {
    triggerHaptic();
    const response = await fetch('/minibar-os/vk-proxy/send-message', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Accept: 'application/json'
      },
      body: JSON.stringify({ message: requestMessage })
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data?.ok) {
      throw new Error(data?.error || 'Не удалось отправить сообщение в беседу');
    }

    showMessage('Сообщение по номеру ' + roomNumber + ' отправлено', 2200);
  } catch (error) {
    console.error('[MINIBAR] Не удалось отправить сообщение об опустошении:', error);
    showMessage(error?.message || 'Не удалось отправить сообщение', 4000);
  } finally {
    setBusy(btnEmpty, false);
  }
});

loaderRetry.addEventListener('click', () => { void takePhoto(); });

void restorePhotoUploadQueue();

(async function boot() {
  try {
    await loadRooms();
    updateQueueDisplay();
    buildCarousel();
    renderDrawerRooms();
    startRoomLiveSync();
  } catch (error) {
    console.error('Rooms load error:', error);
    showMessage(error.message || 'Не удалось загрузить номера', 5000);
    return;
  }

  showCameraStandby();
  await initVK();
})();
</script>
