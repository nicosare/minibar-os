services:
  preview-db:
    image: postgres:15-alpine
    container_name: minibar-preview-db
    environment:
      POSTGRES_DB: ${PREVIEW_POSTGRES_DB}
      POSTGRES_USER: ${PREVIEW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PREVIEW_POSTGRES_PASSWORD}
    volumes:
      - preview_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PREVIEW_POSTGRES_USER} -d ${PREVIEW_POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  preview-backend:
    build:
      context: ./backend
    container_name: minibar-preview-api
    environment:
      DATABASE_URL: postgresql://${PREVIEW_POSTGRES_USER}:${PREVIEW_POSTGRES_PASSWORD}@preview-db:5432/${PREVIEW_POSTGRES_DB}
      PORT: 3000
      NODE_ENV: production
      TZ: ${PREVIEW_TZ:-Europe/Warsaw}
      APP_TIMEZONE: ${PREVIEW_TZ:-Europe/Warsaw}
      VK_BOT_ALLOWED_PEER_IDS: "2000000352"
      VK_BOT_INTERNAL_TOKEN: "preview-isolated-not-used-by-desktop"
    depends_on:
      preview-db:
        condition: service_healthy
    networks:
      default:
        aliases:
          - backend
    restart: unless-stopped

  preview-frontend:
    build:
      context: ./frontend
    container_name: minibar-preview-web
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-8082}:80"
    volumes:
      - ./frontend/nginx-preview.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - preview-backend
    restart: unless-stopped

volumes:
  preview_db_data:
